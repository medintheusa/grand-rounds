<meta charset="utf-8">

<title>Grand Rounds Bloco 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap">
<style>
/* Layout: qbank shell - navy command bar on top, question rail on the left, one question per screen on a cream sheet */
:root{
  --sky:#AFE1FA; --bg:#F1F7FB; --sheet:#FFFFFF; --cream:#FAF6EB; --navy:#0E2149; --ink:#17264A;
  --muted:#51607E; --line:#C7DBEA; --rail:#F4F9FD; --bar:#0E2149; --bar-ink:#FAF6EB;
  --good:#1D7A4C; --good-bg:#E3F4EA; --bad:#B42D24; --bad-bg:#FBE8E6; --flag:#C8102E; --focus:#2C7FB8;
  --sel:#DDEFFB;
  --display:"DM Serif Display", Georgia, "Times New Roman", serif;
  --text:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --ui:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --ease:cubic-bezier(.22,.8,.24,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky:#7CC8EE; --bg:#0A1428; --sheet:#111E3A; --cream:#1A2A4E; --navy:#E9F2FA; --ink:#DCE7F3;
  --muted:#9FB0CC; --line:#2A3C63; --rail:#0E1A33; --bar:#061027; --bar-ink:#FAF6EB;
  --good:#5FD39A; --good-bg:#12382A; --bad:#FF8A80; --bad-bg:#3F1A1C; --flag:#FF6B7F; --focus:#7CC8EE; --sel:#1E3A63;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --sky:#7CC8EE; --bg:#0A1428; --sheet:#111E3A; --cream:#1A2A4E; --navy:#E9F2FA; --ink:#DCE7F3;
  --muted:#9FB0CC; --line:#2A3C63; --rail:#0E1A33; --bar:#061027; --bar-ink:#FAF6EB;
  --good:#5FD39A; --good-bg:#12382A; --bad:#FF8A80; --bad-bg:#3F1A1C; --flag:#FF6B7F; --focus:#7CC8EE; --sel:#1E3A63;
  color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.55;margin:0;-webkit-font-smoothing:antialiased;letter-spacing:-.003em}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.ui{font-family:var(--ui)}
.muted{color:var(--muted)}

/* ---------- intro ---------- */
.intro{max-width:980px;margin:0 auto;padding-block:28px 72px;padding-inline:16px;display:grid;gap:20px}
.banner{background:var(--sky);color:#0E2149;border-radius:28px;padding:clamp(36px,6vw,64px) clamp(20px,5vw,56px) clamp(32px,5vw,52px);display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;position:relative;overflow:hidden}
.banner img{width:clamp(84px,11vw,112px);height:auto;flex:none;margin-bottom:10px}
.banner .eyebrow{font:600 17px/1.3 var(--ui);letter-spacing:-.01em;opacity:.75}
.banner h1{font-family:var(--display);font-weight:400;font-size:clamp(56px,10vw,104px);line-height:.98;letter-spacing:-.015em;margin:.04em 0 .12em;text-wrap:balance}
.banner h1 mark{background:linear-gradient(transparent 55%,#FAF6EB 55%,#FAF6EB 92%,transparent 92%);color:inherit;padding:0 6px}
.banner p{margin:0;font:500 clamp(18px,2.4vw,23px)/1.35 var(--ui);letter-spacing:-.01em;color:#21365F}
.gl{display:block;font:400 16px/1.5 var(--ui);color:var(--muted);margin:0 0 10px}
.namein{font:400 18px/1.2 var(--ui);padding:15px 18px;border:1px solid #C6D4E1;border-radius:14px;background:#FFFFFF;color:var(--ink);width:min(480px,100%);transition:border-color .2s,box-shadow .2s}
.namein:focus{outline:none;border-color:#2C7FB8;box-shadow:0 0 0 4px rgba(175,225,250,.7)}
.gate .gl{display:block;font:400 16px/1.5 var(--ui);color:var(--muted);margin:0 0 10px}
.codein{font:600 19px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;padding:15px 18px;border:1px solid #C6D4E1;border-radius:14px;background:#FFFFFF;color:var(--ink);width:min(300px,100%);transition:border-color .2s,box-shadow .2s}
.codein:focus{outline:none;border-color:#2C7FB8;box-shadow:0 0 0 4px rgba(175,225,250,.7)}
.gmsg{color:var(--bad);font:500 14px/1.4 var(--ui);min-height:1.4em;margin:10px 0 0}
.card{background:var(--sheet);border:0;border-radius:24px;padding:clamp(24px,4vw,40px)}
.card h2{font:700 clamp(24px,3vw,30px)/1.15 var(--ui);letter-spacing:-.02em;margin:0 0 18px;color:var(--navy)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:0;padding:0;list-style:none}
.facts li{padding:4px 22px 4px 0;margin-right:22px;border-right:1px solid var(--line)}
.facts li:last-child{border-right:0;margin-right:0}
.facts b{display:block;font:700 clamp(34px,5vw,52px)/1.05 var(--ui);letter-spacing:-.035em;color:var(--navy);font-variant-numeric:tabular-nums;margin-bottom:6px}
.facts span{font:400 15px/1.4 var(--ui);color:var(--muted)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:#E6EEF5;border-radius:16px;max-width:640px}
.mode{display:block;position:relative;border-radius:12px;padding:14px 16px;cursor:pointer;transition:background .25s var(--ease),box-shadow .25s var(--ease)}
.mode:has(input:checked){background:#FFFFFF;box-shadow:0 1px 2px rgba(14,33,73,.08),0 4px 14px rgba(14,33,73,.08)}
.mode:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.mode input{position:absolute;opacity:0;pointer-events:none}
.mode b{font:600 17px/1.3 var(--ui);letter-spacing:-.01em;color:var(--navy);display:block}
.mode small{font:400 14px/1.4 var(--ui);color:var(--muted);display:block;margin-top:2px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{font:600 17px/1 var(--ui);letter-spacing:-.01em;border-radius:980px;padding:16px 28px;border:0;background:#0E2149;color:#FFFFFF;cursor:pointer;transition:background .2s var(--ease),transform .2s var(--ease)}
.btn:hover{background:#1D3A70}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:#0E2149;box-shadow:inset 0 0 0 1.5px #0E2149}
.btn.ghost:hover{background:rgba(14,33,73,.06)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.resume{font:400 14px/1.4 var(--ui);color:var(--muted)}

/* ---------- exam shell ---------- */
.exam{display:grid;grid-template-columns:104px 1fr;grid-template-rows:auto minmax(0,1fr) auto;height:100vh;height:100dvh;min-height:0;overflow:hidden}
#app{min-height:100%}
.topbar{grid-column:1/-1;position:relative;background:var(--bar);color:var(--bar-ink);display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap;font-family:var(--ui)}
.topbar .item{border:1px solid rgba(250,246,235,.55);border-radius:4px;padding:4px 10px;font-size:13px;line-height:1.35;font-variant-numeric:tabular-nums}
.topbar .spacer{flex:1}
.tb{background:transparent;border:0;color:var(--bar-ink);display:flex;flex-direction:column;align-items:center;gap:2px;font:500 12.5px/1 var(--ui);padding:6px 8px;border-radius:6px;cursor:pointer;min-width:62px}
.tb:hover{background:rgba(250,246,235,.12)}
.tb svg{width:22px;height:22px}
.tb:disabled{opacity:.35;cursor:not-allowed}
.counter{font:600 18px/1 var(--ui);font-variant-numeric:tabular-nums;padding:0 6px}
.rail{background:var(--rail);border-right:1px solid var(--line);font-family:var(--ui);min-height:0;display:flex;flex-direction:column;overflow:hidden}
.rlist{flex:1;min-height:0;overflow-y:scroll;overscroll-behavior:contain}
.rail .rarrow{justify-content:center;flex:none;border:0;background:var(--navy);color:var(--sheet);font:600 12px/1 var(--ui);padding:7px 0;cursor:pointer;width:100%}
.rail .rarrow:disabled{opacity:1;cursor:default}
.rlist,.main{scrollbar-width:auto;scrollbar-color:#8A9BB8 transparent}
.rlist::-webkit-scrollbar,.main::-webkit-scrollbar{width:12px}
.rlist::-webkit-scrollbar-track,.main::-webkit-scrollbar-track{background:color-mix(in srgb,var(--line) 45%,transparent)}
.rlist::-webkit-scrollbar-thumb,.main::-webkit-scrollbar-thumb{background:#8A9BB8;border-radius:8px;border:3px solid transparent;background-clip:padding-box;min-height:40px}
.rlist::-webkit-scrollbar-thumb:hover,.main::-webkit-scrollbar-thumb:hover{background:#0E2148;background-clip:padding-box}
.rail h3{font:600 13px/1.3 var(--ui);text-align:center;margin:10px 4px 6px;color:var(--muted)}
.rail ol{list-style:none;margin:0;padding:0}
.rail button{width:100%;display:flex;align-items:center;gap:6px;padding:7px 10px;border:0;background:transparent;cursor:pointer;font:500 14px/1 var(--ui);font-variant-numeric:tabular-nums;color:var(--ink)}
.rail li:nth-child(even) button{background:color-mix(in srgb,var(--line) 35%,transparent)}
.rail li button[aria-current="true"],.rail li:nth-child(even) button[aria-current="true"]{background:var(--navy);color:var(--sheet)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;border:1.5px solid currentColor}
.dot.done{background:currentColor}
.dot.ok{background:var(--good);border-color:var(--good)}
.dot.no{background:var(--bad);border-color:var(--bad)}
.rail .fl{color:var(--flag);margin-left:auto;font-size:12px}
.main{overflow-y:auto;min-height:0;padding-block:22px 40px;padding-inline:16px}
.sheet{font-size:calc(17.5px * var(--qs,1));max-width:860px;margin:0 auto;background:var(--sheet);border:0;border-radius:22px;padding:28px clamp(18px,4vw,44px) 34px;box-shadow:0 1px 2px rgba(14,33,73,.05)}
.prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(175,225,250,.18)}
.prog i{display:block;height:100%;background:#AFE1FA;border-radius:0 3px 3px 0;transition:width .45s var(--ease)}
@media (prefers-reduced-motion:no-preference){
  .sheet.enter{animation:qin .32s var(--ease)}
  @keyframes qin{from{opacity:0;transform:translate(var(--dx,0px),var(--dy,8px))}to{opacity:1;transform:none}}
  .intro.reveal>*{animation:rise .6s var(--ease) both}
  .intro.reveal>*:nth-child(2){animation-delay:.08s}
  .intro.reveal>*:nth-child(3){animation-delay:.16s}
  .intro.reveal>*:nth-child(4){animation-delay:.24s}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
}
.markrow{display:flex;align-items:center;gap:8px;font:500 14px/1 var(--ui);margin-bottom:18px;color:var(--ink)}
.markrow input{width:17px;height:17px;accent-color:var(--flag)}
.flagico{color:var(--flag)}
.stem p{margin:0 0 1em}
.labs{border-collapse:collapse;margin:4px 0 18px;font-size:.94em;min-width:280px}
.labs caption{text-align:left;font-weight:700;margin-bottom:6px;color:var(--navy)}
.labs td{padding:5px 18px 5px 0;border-bottom:1px dotted var(--line);font-variant-numeric:tabular-nums}
.figure{margin:6px 0 20px}
.figure img{display:block;max-width:100%;width:440px;height:auto;border-radius:6px;border:1px solid var(--line)}
.figure img.wide{width:100%;background:#fff}
.figure figcaption{font:400 12px/1.4 var(--ui);color:var(--muted);margin-top:6px}
.labpanel{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:#DCE1EE;color:#111;z-index:40;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.28);font-family:Arial,Helvetica,sans-serif}
.labhead{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;background:#fff}
.labhead input{flex:1;font:16px Arial,Helvetica,sans-serif;padding:9px 10px;border:1px solid #8a8a8a;border-radius:2px;color:#111;background:#fff}
.labx{background:#1E4A78;color:#fff;border:0;border-radius:6px;width:42px;height:40px;font-size:22px;cursor:pointer;flex:none}
.labtabs{display:flex;gap:2px;padding:0 10px;background:#fff;border-bottom:1px solid #b9c0d0;flex-wrap:wrap}
.labtabs button{font:15px Arial,Helvetica,sans-serif;padding:8px 10px;border:1px solid #b9c0d0;border-bottom:0;background:#fff;color:#111;cursor:pointer;border-radius:3px 3px 0 0;margin-bottom:-1px}
.labtabs button[aria-selected="true"]{background:#DCE1EE;font-weight:700}
.labscroll{flex:1;overflow-y:auto;min-height:0}
.labtbl{width:100%;border-collapse:collapse;font-size:15px;line-height:1.35}
.labtbl td{padding:9px 8px;border-bottom:1px solid #b9c0d0;vertical-align:top}
.labtbl td:first-child{width:46%}
.labtbl tr.lh td{font-weight:700;padding-top:12px}
.labtbl tr.lh td:last-child{text-align:center}
.labtbl tr.ls td{font-weight:700;font-style:italic}
.labtbl tr.li td:first-child{padding-left:28px}
.labtbl .lempty{text-align:center;color:#555;padding:24px}
#labbtn[aria-pressed="true"]{background:rgba(250,246,235,.18)}
.fz{display:flex;align-items:center;gap:2px}
.fz button{background:transparent;border:1px solid rgba(250,246,235,.5);color:var(--bar-ink);font:700 14px/1 var(--ui);padding:7px 9px;border-radius:6px;cursor:pointer;min-width:38px}
.fz button:disabled{opacity:.35;cursor:default}
.fz .big{font-size:18px}
.tblogo{height:46px;width:auto;flex:none;background:#E8F3FB;border-radius:10px;padding:3px 6px}
@media (max-width:640px){.tblogo{height:36px;padding:2px 4px}}
.qtitle{font-weight:700;color:var(--navy);margin:6px 0 16px}
mark.hl{background:#F7FF3C;color:#111;border-radius:2px;padding:0 1px;cursor:pointer;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hlbtn{position:fixed;z-index:30;background:#0E2148;color:#FAF6EB;border:2px solid #F7FF3C;border-radius:8px;padding:8px 14px;font:600 14px/1 var(--ui);box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
.hint{font:400 13px/1.4 var(--ui);color:var(--muted);margin:-6px 0 14px}
.opts{border:1px solid #C6D4E1;border-radius:16px;padding:6px;max-width:660px;margin:0;list-style:none}
.opt{display:grid;grid-template-columns:auto auto 1fr auto;align-items:start;gap:10px;padding:10px 14px;border-radius:11px;transition:background .2s var(--ease)}
.opt:hover{background:#F3F8FC}
.opt:has(input:checked){background:var(--sel)}
.opt input{width:19px;height:19px;margin-top:4px;accent-color:var(--navy)}
.opt label{display:contents;cursor:pointer}
.opt .L{font-weight:600}
.opt.struck .txt,.opt.struck .L{text-decoration:line-through;color:var(--muted)}
.strike{background:transparent;border:0;color:var(--muted);font:500 13px/1 var(--ui);text-decoration:line-through;cursor:pointer;padding:5px 4px;border-radius:4px}
.strike:hover{color:var(--ink)}
.opt.correct{background:var(--good-bg)}
.opt.correct .L,.opt.correct .txt{color:var(--good);font-weight:700}
.opt.wrong{background:var(--bad-bg)}
.opt.wrong .L,.opt.wrong .txt{color:var(--bad)}
.pct{font:500 12.5px/1.8 var(--ui);color:var(--muted);font-variant-numeric:tabular-nums}
.actions{margin-top:18px}
.verdict{margin-top:22px;border-left:5px solid var(--good);background:var(--good-bg);padding:12px 16px;border-radius:4px;font-family:var(--ui);font-size:15px}
.expl{margin-top:16px;border:1.5px solid var(--sky);background:var(--cream);border-radius:10px;padding:16px 18px;font-family:var(--ui);font-size:15px;line-height:1.55;color:var(--ink)}
.expl h3{margin:0 0 6px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
.fcs{display:grid;gap:10px;margin-top:8px}
.fc{border:1.5px solid var(--navy);border-radius:10px;background:#fff;overflow:hidden}
.fc-n{font:700 11px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;background:var(--navy);color:#fff;padding:6px 10px}
.fc-f,.fc-b{padding:9px 12px;font:15px/1.5 var(--ui);color:var(--ink)}
.fc-b{background:var(--sky,#AFE1FA);border-top:1px solid rgba(14,33,73,.2)}
.fc-f span,.fc-b span{display:block;font:700 10px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--navy);opacity:.6;margin-bottom:4px}
.fc-copy{margin-top:10px;font:700 14px/1 var(--ui);background:var(--navy);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}
.expl h3.o{margin-top:14px}
.expl p{margin:0}
.expl ul{margin:0;padding:0;list-style:none}
.expl li{padding:5px 0;border-top:1px solid rgba(14,33,73,.12)}
.expl li:first-child{border-top:0}
.verdict.no{border-color:var(--bad);background:var(--bad-bg)}
.verdict b{font-size:16px}
.expl{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
.expl h4{font:700 15px/1.3 var(--ui);color:var(--navy);margin:0 0 8px}
.expl p{margin:0 0 .8em}
.expl .ans{color:var(--good);font-weight:700}
.botbar{grid-column:1/-1;background:var(--bar);color:var(--bar-ink);display:flex;align-items:center;gap:12px;padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));font-family:var(--ui);flex-wrap:wrap}
.clock{border:1px solid rgba(250,246,235,.55);border-radius:4px;padding:6px 12px;font:500 14px/1.2 var(--ui);font-variant-numeric:tabular-nums}
.clock.low{background:#B42D24;border-color:#B42D24}

.send{background:#0E2149;color:#EAF4FB}
.send h2{color:#FFFFFF}
.send .btn{background:#AFE1FA;color:#0E2149}
.send .btn:hover{background:#CDEDFC}
.send .sent{color:#AFE1FA}
.send p{margin:0 0 14px;font-family:var(--ui);font-size:15px}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.sent{font:500 14px/1.4 var(--ui);color:var(--good)}
/* ---------- dialog ---------- */
.veil{position:fixed;inset:0;background:rgba(6,16,39,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;padding:16px;z-index:10}
.dlg{background:var(--sheet);color:var(--ink);border-radius:22px;padding:24px;max-width:440px;width:100%;font-family:var(--ui);border:1px solid var(--line)}
.dlg h3{margin:0 0 8px;font:600 19px/1.3 var(--ui);color:var(--navy)}
.dlg p{margin:0 0 18px;font-size:15px}

/* ---------- results ---------- */
.results{max-width:900px;margin:0 auto;padding-block:26px 48px;padding-inline:16px;display:grid;gap:20px}
.score{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.ring{width:148px;height:148px}
.ring .arc{transition:stroke-dashoffset 1.1s var(--ease)}
.ring text{font-family:var(--ui);fill:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stats div{background:var(--bg);border-radius:16px;padding:14px 16px}
.stats b{display:block;font:700 30px/1.1 var(--ui);letter-spacing:-.03em;color:var(--navy);font-variant-numeric:tabular-nums}
.stats span{font:400 14px/1.3 var(--ui);color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table.rev{border-collapse:collapse;width:100%;font-family:var(--ui);font-size:14px}
table.rev th{text-align:left;font-weight:600;color:var(--muted);font-size:14px;border-bottom:1px solid var(--line);padding:8px}
table.rev td{border-bottom:1px solid var(--line);padding:9px 8px;vertical-align:top}
table.rev td.n{font-variant-numeric:tabular-nums;width:40px}
table.rev button{background:transparent;border:0;color:var(--navy);text-decoration:underline;cursor:pointer;padding:0;text-align:left;font:500 14px/1.4 var(--ui)}
.pill{display:inline-block;font:600 12px/1 var(--ui);padding:5px 8px;border-radius:999px}
.pill.ok{background:var(--good-bg);color:var(--good)}
.pill.no{background:var(--bad-bg);color:var(--bad)}
.pill.skip{background:var(--cream);color:var(--muted)}

@media (max-width:640px){
  .facts{grid-template-columns:1fr 1fr;row-gap:18px}
  .facts li:nth-child(2n){border-right:0;margin-right:0}
  .modes{grid-template-columns:1fr}
  .exam{grid-template-columns:1fr}
  .rail{display:none}
  .rail.open{display:flex;position:fixed;top:0;bottom:0;left:0;width:120px;z-index:5;box-shadow:4px 0 18px rgba(0,0,0,.25)}
  .tb span.lbl{display:none}
  .tb{min-width:40px}
  .score{grid-template-columns:1fr;justify-items:start}
  body{font-size:16px}
}

/* ---- refinamentos: toque, contraste, transparência, movimento ---- */
button,.opt,.mode,label,.btn,.rail li button,.strike{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.opt{transition:background .2s var(--ease),transform .15s var(--ease)}
.opt:active{background:var(--sel);transform:scale(.995)}
.rail li button{transition:background .15s var(--ease),transform .15s var(--ease)}
.rail li button:active{transform:scale(.97)}
.tb:active,.fz button:active,.strike:active,.rail .rarrow:active{transform:scale(.94);opacity:.85}
.tb,.fz button,.strike{transition:background .2s var(--ease),transform .15s var(--ease),opacity .15s}
.rail .rarrow,.rail .rarrow:disabled,.rail .rarrow:active,.rail .rarrow:hover,.rail .rarrow:focus{transition:none !important;opacity:1 !important;transform:none !important;background:var(--navy) !important;color:var(--sheet) !important;-webkit-tap-highlight-color:transparent;outline:none}
.mode:active{transform:scale(.99)}
@media (pointer:coarse){
  .fz button{min-height:44px;min-width:44px}
  .tb{min-height:44px;min-width:44px}
  .rail .rarrow{padding:12px 0}
  .strike{min-width:44px;min-height:44px}
  .opt{padding-block:12px}
}
@media (prefers-contrast:more){
  :root{--muted:#2B3A57;--line:#7C93AE}
  .opts,.namein,.codein{border-color:#4B607C}
  .opt .L,.pct{color:var(--ink)}
}
@media (prefers-reduced-transparency:reduce){
  .veil{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(6,16,39,.82)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
  .opt:active,.rail li button:active,.tb:active,.fz button:active,.btn:active,.mode:active{transform:none}
  .prog i,.ring .arc{transition:none}
  .sheet.enter{animation:rfade .15s linear}
  @keyframes rfade{from{opacity:0}to{opacity:1}}
}

/* Lab Values ancorado ao botao */
@media (prefers-reduced-motion:no-preference){
  .labpanel{transform-origin:var(--ox,100%) var(--oy,0)}
  .labpanel.pop-in{animation:labin .28s var(--ease) both}
  .labpanel.pop-out{animation:labout .2s var(--ease) both;pointer-events:none}
  @keyframes labin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
  @keyframes labout{from{opacity:1;transform:none}to{opacity:0;transform:scale(.6)}}
}

{"stem": ["A 37-year-old man comes to the emergency department with his sister because of “bruises that will not go away.” He first noticed a few flat purple spots on his forearms about 3 months ago and thought they were from lifting boxes at work. Since then, more spots have appeared on his back and trunk, and some have become slightly raised. They do not itch or hurt.", "He was diagnosed with HIV infection 5 years ago but stopped taking his antiretroviral medications 18 months ago after losing his health insurance. He has had two episodes of oral thrush during the past year, treated at an urgent care clinic. He has smoked one pack of cigarettes daily for 15 years and drinks 3 to 4 beers on weekends. He reports mild fatigue but no fever, night sweats, cough, or diarrhea.", "His temperature is 37.1°C (98.8°F), pulse is 84/min, and blood pressure is 122/76 mm Hg. Examination shows multiple violaceous, nonblanching macules and plaques on the back, trunk, and both upper extremities, several oriented along skin lines. A similar purple lesion is present on the hard palate. There is no lymphadenopathy. CD4+ T-lymphocyte count is 72/mm³. A photograph of lesions on his trunk is shown."], "q": "Infection with which of the following is most directly associated with the development of these lesions?", "o": ["Cytomegalovirus", "Epstein-Barr virus", "Human herpesvirus 8", "Human papillomavirus type 16", "Varicella-zoster virus"], "k": "D", "img": {"src": "K", "alt": "Violaceous nodular skin lesions", "credit": "CDC Public Health Image Library"}},
{"stem": ["A 34-year-old woman comes to the physician because of fatigue, shortness of breath when climbing stairs, and trouble concentrating at her job as an accountant for the past 5 weeks. She has had generalized tonic-clonic seizures since age 16, which have been well controlled with the same daily medication; her last seizure was 4 years ago.", "She works long hours during tax season and says that she often skips meals and “lives on coffee and crackers.” She drinks 2 glasses of wine with dinner on weekends. She does not smoke. Her mother has hypothyroidism. Her last menstrual period was 2 weeks ago, and her periods are regular and not heavy.", "She appears pale. Pulse is 96/min. There is no jaundice or glossitis. Neurologic examination shows normal strength, reflexes, vibration sense, and position sense; Romberg sign is absent. Hemoglobin is 9.1 g/dL, mean corpuscular volume is 114 μm³, and the reticulocyte count is low. Serum homocysteine concentration is increased."], "q": "Which of the following is the most likely cause of this patient's anemia?", "o": ["Anemia of chronic disease", "Iron deficiency anemia", "Pernicious anemia", "Medication-induced folate deficiency", "Vitamin B12 deficiency from poor intake"], "k": "E"},
{"stem": ["A 24-year-old man comes to the clinic for a physical examination required for a new job as a firefighter. He feels well. He runs 5 km three times a week, does not smoke, and drinks alcohol only at social events. He takes no medications.", "He recalls that he “had some kind of surgery down there” as a young child; his father later told him that his left testis “was not in the right place” at birth and was repaired before he started kindergarten. He has had no scrotal pain, swelling, or lumps since then. He has been in a monogamous relationship with a female partner for 3 years and reports normal libido and erections. His father had a kidney stone, and his maternal uncle had prostate cancer at age 70.", "Vital signs are within normal limits. Examination shows normal secondary sexual characteristics. Both testes are in the scrotum, symmetric in size, and smooth, without tenderness or masses. There is no inguinal hernia."], "q": "This patient is at greatest risk of developing which of the following?", "o": ["Epididymitis", "Hydrocele", "Testicular cancer", "Testicular torsion", "Varicocele"], "k": "D"},
{"stem": ["A 14-year-old girl is brought to the physician by her father because she has not had a menstrual period and “looks younger than her friends.” She has no headaches, visual changes, galactorrhea, or cyclic abdominal pain. She plays in the school band, has good grades, and eats three meals a day. She is not trying to lose weight and does not exercise excessively.", "She was born at term after an uncomplicated pregnancy and has never been hospitalized. She takes no medications. Her mother had menarche at age 12, and her older sister at age 13.", "She is 145 cm (4 ft 9 in) tall, below the 3rd percentile; her weight is at the 25th percentile. Her sense of smell is normal. Breast development is Tanner stage 1. Pubic and axillary hair are Tanner stage 3. There is no acne, hirsutism, or clitoromegaly. External genitalia are normal female."], "q": "Which of the following sets of serum findings is most likely in this patient?", "o": ["↓ Estrogen, ↓ inhibin B, ↓ LH, ↓ FSH", "↓ Estrogen, ↓ inhibin B, ↑ LH, ↑ FSH", "↓ Estrogen, ↓ inhibin B, ↑ LH, ↓ FSH", "↑ Estrogen, ↑ inhibin B, ↓ LH, ↓ FSH", "↑ Estrogen, ↑ inhibin B, ↑ LH, ↑ FSH"], "k": "C"},
{"stem": ["A 47-year-old man is admitted to the intensive care unit after inhaling chlorine gas while cleaning the filtration system at the public pool where he works. He had immediate coughing and burning in his throat and became progressively short of breath over the next 12 hours. He has hypertension treated with lisinopril and smoked half a pack of cigarettes daily until 10 years ago.", "He requires intubation and mechanical ventilation. A chest x-ray shows bilateral diffuse opacities. Despite improvement of the upper airway swelling, his hypoxemia worsens over the next 3 days. A lung specimen obtained during evaluation shows widespread loss of the thin, flat cells lining the alveoli, with eosinophilic membranes along the alveolar walls. He is gradually weaned from the ventilator, and his oxygen saturation on room air returns to normal 5 weeks later."], "q": "Proliferation of which of the following cell types was most responsible for restoring the alveolar lining?", "o": ["Alveolar macrophages", "Bronchial goblet cells", "Club (Clara) cells", "Type I pneumocytes", "Type II pneumocytes"], "k": "F"},
{"stem": ["A pharmaceutical company has developed a new oral anticoagulant to prevent stroke in patients with atrial fibrillation. Earlier studies established a safe dose and showed that the drug works in a small group of patients.", "The company now enrolls 6,000 patients with atrial fibrillation at many hospitals. Patients are randomly assigned to receive the new drug or warfarin, and the study is double-blinded. They are followed for 3 years to compare the rates of stroke and major bleeding. The company will use the results to request approval to sell the drug."], "q": "Which of the following best describes this study?", "o": ["Phase I clinical trial", "Phase II clinical trial", "Phase III clinical trial", "Phase IV clinical trial", "Post-marketing surveillance study"], "k": "D"},
{"stem": ["A 22-year-old man comes to the clinic because of a rash on his upper back and shoulders that has bothered him for 3 summers. He works as a surf instructor and spends most of the day at the beach. The lighter patches appear every year when the weather gets hot and become more noticeable when he gets a tan. They are not itchy or painful.", "He has tried showering twice a day, an over-the-counter moisturizer, and an antibacterial soap, without improvement. His girlfriend is worried the rash is contagious. He has no fever, weight loss, or joint pain. He takes no medications. His younger brother has atopic dermatitis.", "Examination shows numerous round, hypopigmented macules on the upper back and shoulders that merge into larger patches, some with a faint pink tinge. A fine, powdery scale becomes more visible when the lesions are gently scraped. The face, scalp, groin, palms, and soles are spared. There is no lymphadenopathy. A potassium hydroxide preparation of the scale shows short hyphae and round yeast forms. A photograph of the lesions is shown."], "q": "Which of the following is the most appropriate treatment?", "o": ["Oral fluconazole for the patient and his girlfriend", "Oral terbinafine for the patient only", "Topical hydrocortisone for the patient only", "Topical selenium sulfide for the patient and his girlfriend", "Topical selenium sulfide for the patient only"], "k": "F", "img": {"src": "T", "alt": "Hypopigmented macules coalescing into patches with fine scale on the upper back", "credit": ""}},
{"stem": ["A 58-year-old man is brought to the emergency department 2 hours after his motorcycle slid on wet pavement and his right leg was pinned between the bike and the curb. He was wearing a helmet and did not lose consciousness. He has type 2 diabetes mellitus well controlled with metformin, and his most recent hemoglobin A1c was 6.4%. He reports no numbness or burning in his feet before the accident.", "His pulse is 96/min, and blood pressure is 138/84 mm Hg. Examination shows a large contusion and swelling over the lateral aspect of the right mid-calf; the compartments are soft, and dorsalis pedis and posterior tibial pulses are palpable. X-rays show no fractures. Sensation to light touch and pinprick is decreased over the lateral right lower leg and most of the dorsum of the foot but is normal in the web space between the first and second toes and along the lateral border of the foot. He cannot turn the sole of his right foot outward against resistance. Dorsiflexion of the ankle and toes, plantar flexion, and inversion have full strength. Ankle reflexes are 2+ bilaterally."], "q": "Injury to which of the following nerves best explains these findings?", "o": ["Common fibular (peroneal) nerve", "Deep fibular (peroneal) nerve", "Sural nerve", "Superficial fibular (peroneal) nerve", "Tibial nerve"], "k": "E"},
{"stem": ["A 38-year-old woman comes to the physician because of shortness of breath when walking uphill or carrying groceries for the past year; she now has to stop to rest on the stairs to her third-floor apartment. She also reports occasional episodes of a fast, irregular heartbeat lasting several minutes. She has no chest pain, orthopnea, or leg swelling. She grew up in a rural area and recalls having “a lot of sore throats” as a child, but she was never told she had heart problems. She has two children, and both pregnancies were uncomplicated. She does not smoke and takes no medications.", "Her pulse is 88/min and regular, and blood pressure is 118/74 mm Hg. Jugular venous pressure is normal. The lungs are clear to auscultation. There is a left parasternal lift. S2 is widely split, and the split does not change with inspiration or expiration. A grade 2/6 midsystolic murmur is heard at the left upper sternal border, and a soft, low-pitched mid-diastolic rumble is heard at the left lower sternal border. There is no cyanosis, clubbing, or edema. An ECG shows right axis deviation and an incomplete right bundle branch block. A chest x-ray shows an enlarged right heart border and increased pulmonary vascular markings."], "q": "Which of the following is the most likely diagnosis?", "o": ["Aortic regurgitation", "Atrial septal defect", "Mitral stenosis", "Patent ductus arteriosus", "Ventricular septal defect"], "k": "C"},
{"stem": ["A 10-month-old boy is brought to the clinic because of his third ear infection in 4 months. His mother has also noticed tiny red spots on his legs and occasional streaks of blood in his diapers. Two months ago, he was hospitalized for 5 days for pneumonia treated with intravenous antibiotics. He has had an itchy rash on his face and in the creases of his elbows and knees since age 3 months, treated with moisturizers and a low-potency topical corticosteroid. He was born at term, and his immunizations are up to date. His mother says that her brother “had a blood problem and died as a baby.”", "His weight is at the 10th percentile. His temperature is 38.2°C (100.8°F). Examination shows a bulging, erythematous right tympanic membrane, dry, scaly, erythematous plaques on the cheeks and antecubital and popliteal fossae, and scattered petechiae on the lower extremities. There is no hepatosplenomegaly."], "q": "Which of the following best explains this patient's condition?", "o": ["Defective B-cell class switching", "Defective NADPH oxidase activity", "Impaired phagolysosome fusion", "Mutation affecting actin cytoskeleton organization in hematopoietic cells", "Mutation in complement component C2"], "k": "E", "labs": [["Hemoglobin", "10.9 g/dL"], ["Leukocyte count", "8,400/mm³"], ["Platelet count", "38,000/mm³"], ["Mean platelet volume", "5.8 fL (N = 8–12)"], ["IgG", "normal"], ["IgM", "decreased"], ["IgA", "increased"], ["IgE", "increased"]]},
{"stem": ["A 28-year-old man comes to the physician because of a painless “heaviness” in his left testis that he noticed while showering 6 weeks ago. He thought it was from a minor injury playing soccer, but it has not gone away. He has no dysuria, urethral discharge, or fever. He is sexually active with one female partner and uses condoms inconsistently. He had an inguinal hernia repaired on the right side at age 6. He does not smoke and drinks alcohol socially.", "Vital signs are within normal limits. Examination shows a firm, nontender, 2-cm mass within the left testis that does not transilluminate. The epididymis is normal. There is no inguinal lymphadenopathy. Scrotal ultrasonography shows a hypoechoic intratesticular mass. Serum β-hCG and α-fetoprotein concentrations are increased. Radical inguinal orchiectomy confirms a germ cell tumor."], "q": "Which of the following lymph node groups is the most likely initial site of metastasis from this tumor?", "o": ["Deep inguinal", "External iliac", "Para-aortic (retroperitoneal)", "Superficial inguinal", "Internal iliac"], "k": "D"},
{"stem": ["A 35-year-old man comes to the physician because of severe burning pain in the fingers of his right hand and the toes of his left foot for 4 months. The pain is worse at night and when his hands are cold, and his fingers turn white and then blue in cold weather. Two weeks ago, he noticed a painful sore on the tip of his right index finger. He works as a delivery driver and says that he has had “tender red lumps” along the veins of his legs that came and went over the past year. He has smoked 1.5 packs of cigarettes daily since age 14 and occasionally uses marijuana. He drinks 3 to 4 beers on weekends. His father had a myocardial infarction at age 68.", "His pulse is 84/min, and blood pressure is 128/80 mm Hg. Radial pulses are weak on the right, and the dorsalis pedis and posterior tibial pulses are absent on the left. There is a 4-mm ulcer on the tip of the right index finger, and the left fourth toe is dark and dry. Fasting lipid profile, hemoglobin A1c, antinuclear antibodies, and antiphospholipid antibodies are within normal limits. Angiography shows segmental occlusions of the small and medium arteries of the forearm and lower leg, with “corkscrew” collateral vessels and normal proximal arteries."], "q": "Which of the following is the most important factor in the development of this patient's condition?", "o": ["Alcohol use", "Cigarette smoking", "Family history of cardiovascular disease", "Marijuana use", "Occupational vibration exposure"], "k": "C"},
{"stem": ["A 17-year-old boy is brought to the emergency department 3 hours after he fell onto his outstretched right hand while skateboarding. He was able to get up and finish the session but now has pain in his right wrist that worsens when he grips his phone. He is right-handed and plays volleyball on his school team. He had a fracture of the left clavicle at age 10. He takes no medications.", "Vital signs are within normal limits. There is mild swelling over the radial side of the right wrist, without deformity. There is tenderness to palpation in the depression between the tendons of the abductor pollicis longus/extensor pollicis brevis and the extensor pollicis longus, and pain with axial loading of the thumb. Radial pulse and capillary refill are normal, and sensation is intact in all fingers. Initial x-rays of the wrist show no fracture."], "q": "Which of the following is the most likely injured bone and the source of the blood supply most at risk?", "o": ["Hamate; ulnar artery", "Lunate; anterior interosseous artery", "Scaphoid; ulnar artery", "Scaphoid; radial artery", "Trapezium; radial artery"], "k": "E"},
{"stem": ["A 20-year-old man comes to the physician because of painful muscle cramps in his legs during intense exercise since he joined a college rowing team 6 months ago. The cramps start within the first few minutes of training. He has learned that if he slows down and rests for a few minutes, he can then continue training for a longer time with less pain. On two occasions after hard sprint sessions, he noticed dark, cola-colored urine. He has no weakness at rest, hypoglycemia, or difficulty walking. He takes a creatine supplement and drinks protein shakes. He is adopted and does not know his family history.", "Vital signs are within normal limits. Examination shows normal muscle bulk, strength, and reflexes. Serum creatine kinase concentration is 1,850 U/L. Urinalysis after exercise is positive for blood, but microscopy shows no erythrocytes. Fasting glucose concentration is normal, and there is no hepatomegaly. During a forearm exercise test, serum ammonia increases normally, but serum lactate does not increase."], "q": "A deficiency of which of the following enzymes is the most likely cause of this patient's condition?", "o": ["Muscle glycogen phosphorylase", "Glucose-6-phosphatase", "Lysosomal acid α-1,4-glucosidase", "Debranching enzyme (α-1,6-glucosidase)", "Carnitine palmitoyltransferase II"], "k": "B"},
{"stem": ["A 66-year-old man comes to the emergency department because of fever, chills, fatigue, and dark urine for 5 days. He returned 2 weeks ago from a month-long summer vacation on Nantucket Island, Massachusetts, where he went hiking and gardening most days. He does not recall any insect bites. He had a splenectomy 15 years ago after a car accident. He has hypertension treated with amlodipine. He has not traveled outside the United States in the past 10 years.", "His temperature is 38.9°C (102°F), pulse is 108/min, and blood pressure is 112/68 mm Hg. He has scleral icterus. There is no rash or lymphadenopathy. Hemoglobin is 8.6 g/dL, reticulocyte count is 6%, platelet count is 92,000/mm³, serum lactate dehydrogenase is increased, and haptoglobin is undetectable. Serum total bilirubin is 3.4 mg/dL, mostly indirect. A peripheral blood smear shows small intraerythrocytic ring forms; some erythrocytes contain four organisms arranged in a cross. There are no schizonts or gametocytes."], "q": "Which of the following is the most likely diagnosis and the vector that transmits it?", "o": ["Malaria; Anopheles mosquito", "Ehrlichiosis; Amblyomma americanum tick", "Lyme disease; Ixodes scapularis tick", "Rocky Mountain spotted fever; Dermacentor tick", "Babesiosis; Ixodes scapularis tick"], "k": "F"},
{"stem": ["A 48-year-old woman comes to the physician because of fatigue, early satiety, and a dull ache under her left ribs for 3 months. She has lost 4 kg (8.8 lb) without trying. She has had night sweats several times a week. She works as a radiology technician and has hypothyroidism treated with levothyroxine. Her mother had breast cancer at age 60.", "Her temperature is 37.4°C (99.3°F). Examination shows pallor. The spleen is palpable 8 cm below the left costal margin. There is no lymphadenopathy. Laboratory studies show a hemoglobin of 10.6 g/dL, leukocyte count of 142,000/mm³, and platelet count of 520,000/mm³. A peripheral blood smear shows neutrophils at all stages of maturation, with many myelocytes, increased basophils and eosinophils, and less than 2% blasts. Leukocyte alkaline phosphatase score is low. Fluorescence in situ hybridization detects a BCR::ABL1 fusion gene."], "q": "Which of the following is the most appropriate pharmacotherapy?", "o": ["All-trans retinoic acid", "Hydroxyurea alone", "Imatinib", "Rituximab", "Ruxolitinib"], "k": "D"},
{"stem": ["A 47-year-old man is brought to the emergency department by his wife because of a severe headache that began abruptly this morning while he was at work. He describes it as “the worst headache” he has ever had, with nausea and blurred vision. His wife says he seemed confused and had difficulty recognizing objects around him. He has hypertension treated with lisinopril and was recently evaluated by his primary care physician for progressive fatigue, decreased libido, and mild weight gain; no treatment was started. He takes no anticoagulants and has had no head trauma. He has no fever or neck pain.", "He is diaphoretic and restless. Temperature is 36.8°C (98.2°F), pulse is 118/min, respirations are 22/min, and blood pressure is 88/54 mm Hg. The neck is supple. He has bilateral ptosis with impaired extraocular movements and reduced peripheral vision. The heart and lungs are clear. Serum sodium is 129 mEq/L and glucose is 56 mg/dL. MRI of the brain shows an enlarged sellar mass with evidence of recent hemorrhage."], "q": "Which of the following best explains this patient's acute presentation?", "o": ["Acute hemorrhagic infarction of a pituitary adenoma", "Cavernous sinus thrombosis due to septic spread from the paranasal sinuses", "Hemorrhage into a Rathke cleft cyst", "Metastatic spread from a systemic malignancy to the pituitary gland", "Noncaseating granulomatous infiltration of the pituitary gland"], "k": "B"},
{"stem": ["A 41-year-old woman who works as a physical therapy assistant comes to the clinic because of right leg pain and weakness for 10 days. The pain began in the low back while she was helping transfer a patient from a bed to a wheelchair, then spread to the right buttock and, over the next few days, down the lateral thigh and calf to the top of the foot and great toe. Coughing worsens the pain. She has noticed that her right foot “slaps” the floor when she walks and that she trips on the carpet at home. She has no fever, weight loss, saddle numbness, urinary retention, or fecal incontinence. She has had two uncomplicated pregnancies and takes no medications. Her father has rheumatoid arthritis.", "Vital signs are within normal limits. The spine is not tender. Strength is 3/5 in right great toe extension and 4/5 in right ankle dorsiflexion and eversion; she cannot walk on her right heel. Plantar flexion strength is 5/5, and she can walk on her toes. Knee and ankle reflexes are 2+ and symmetric. Pinprick sensation is decreased over the lateral leg, dorsum of the foot, and great toe on the right. Straight-leg raise at 35 degrees on the right reproduces the leg pain."], "q": "Which of the following nerve roots is most likely compressed?", "o": ["L3", "L4", "L5", "S1", "S2"], "k": "D"},
{"stem": ["A 4-year-old boy is brought to the clinic by his mother because of swelling around the eyes that has increased over 5 days and now involves both feet and the scrotum. The swelling is worse in the morning. Two weeks ago he had a runny nose and cough that resolved without treatment. He attends day care, where other children recently had colds. He has seasonal allergies and mild eczema. His mother has noticed that his urine looks foamy but has seen no blood. He has had no rash, joint pain, or sore throat. Immunizations are up to date. There is no family history of kidney disease; his older sister has asthma.", "Temperature is 36.9°C (98.4°F) and blood pressure is 98/60 mm Hg. Examination shows periorbital and scrotal edema, pitting edema of both ankles, and mild ascites. There is no rash. Serum albumin is 1.9 g/dL, total cholesterol is 340 mg/dL, creatinine is 0.4 mg/dL, and C3 is within the reference range. Urinalysis shows 4+ protein, with no blood and no casts. The urine protein-to-creatinine ratio is 9."], "q": "Which of the following findings is most likely on renal biopsy?", "o": ["Mesangial IgA deposits on immunofluorescence", "Normal glomeruli on light microscopy with diffuse effacement of podocyte foot processes on electron microscopy", "Splitting and lamination of the glomerular basement membrane", "Segmental areas of glomerular scarring", "Subepithelial “humps” on electron microscopy"], "k": "C"},
{"stem": ["A 46-year-old woman with bipolar I disorder comes to the physician because of 7 months of excessive thirst and urination. She wakes 4 to 5 times each night to urinate and keeps a gallon jug of water at her bedside; she estimates she drinks 9 liters daily. She has taken lithium for 12 years, and her serum lithium concentrations were in the therapeutic range at her last two visits. Her psychiatrist reports that her mood has been stable. She takes no diuretics and has had no head trauma or brain surgery. There is no family history of diabetes insipidus.", "Blood pressure is 110/70 mm Hg. Mucous membranes are dry. Serum sodium is 151 mEq/L, potassium is 3.9 mEq/L, calcium is 9.4 mg/dL, glucose is 92 mg/dL, and creatinine is 1.0 mg/dL. Plasma osmolality is 308 mOsm/kg and urine osmolality is 85 mOsm/kg; urine glucose is negative. After 8 hours of water deprivation, urine osmolality is 105 mOsm/kg. After administration of desmopressin, it is 112 mOsm/kg. Plasma ADH concentration is elevated."], "q": "Which of the following best explains this patient's polyuria?", "o": ["Decreased synthesis of ADH by hypothalamic neurons", "Osmotic diuresis from hyperglycemia", "A primary defect in thirst regulation with excessive water intake", "Hypercalcemia-induced impairment of tubular concentrating ability", "Reduced responsiveness of collecting duct cells to ADH due to decreased aquaporin-2 expression"], "k": "F"},
{"stem": ["A 57-year-old man comes to the physician because of leg swelling for 5 weeks. He has also noticed foamy urine and has lost 5 kg (11 lb) without trying. He has smoked 1 pack of cigarettes daily for 35 years. He takes ibuprofen for knee osteoarthritis. He has had no fever, rash, joint pain, or gross hematuria.", "Blood pressure is 142/86 mm Hg. There is periorbital edema and pitting edema of both legs to the knees. Serum albumin is 2.0 g/dL, total cholesterol is 380 mg/dL, and creatinine is 1.1 mg/dL. Hepatitis B and C serologies are negative; antinuclear antibodies are negative, and C3 and C4 are within the reference range. Urinalysis shows 4+ protein, no red blood cells, and no casts. A 24-hour urine collection contains 9.5 g of protein. A renal biopsy specimen is obtained; a periodic acid–Schiff–stained glomerulus is shown."], "q": "Which of the following best explains the renal pathology in this patient?", "o": ["Crescent formation with proliferation of parietal epithelial cells", "Mesangial IgA immune complex deposition", "Antibodies against the phospholipase A2 receptor", "Subendothelial immune complex deposition", "T-cell–mediated podocyte foot process effacement"], "k": "D", "img": {"src": "M", "alt": "Renal biopsy, PAS stain", "credit": ""}},
{"stem": ["A 63-year-old woman with chronic kidney disease from long-standing type 2 diabetes mellitus and hypertension comes for follow-up because of fatigue, generalized bone aches, itching, and trouble rising from a chair for several months. She has had no fractures. Her medications include insulin, losartan, and occasional calcium carbonate tablets. She drinks several colas daily and eats mostly processed foods.", "Blood pressure is 154/90 mm Hg. There is tenderness over the anterior tibia. Laboratory studies show:"], "q": "Which of the following mechanisms most directly accounts for this patient's elevated PTH concentration?", "o": ["Decreased renal 1α-hydroxylation and phosphate retention causing chronic hypocalcemia and parathyroid hyperplasia", "Autonomous PTH secretion from a solitary parathyroid adenoma", "Secretion of PTH-related peptide by a malignant tumor", "Autoimmune destruction of parathyroid chief cells", "Release of calcium from osteolytic skeletal metastases"], "k": "B", "labs": [["Serum calcium", "7.5 mg/dL"], ["Serum phosphate", "6.9 mg/dL"], ["Creatinine", "3.4 mg/dL (eGFR 18 mL/min/1.73 m²)"], ["Alkaline phosphatase", "280 U/L"], ["Intact PTH", "720 pg/mL"], ["25-Hydroxyvitamin D", "16 ng/mL"]]},
{"stem": ["A 9-day-old girl is brought to the emergency department because of poor feeding and vomiting for 2 days and increasing lethargy. She was born at term at home with a midwife, and no newborn screening was done. Her parents say she “looks tan.” The parents' first son died at 3 weeks of age of “dehydration” in another country.", "Her weight is 8% below birth weight. She has dry mucous membranes, pulse of 190/min, blood pressure of 62/30 mm Hg, and capillary refill of 4 seconds. The nipples and genitalia are hyperpigmented. The clitoris is enlarged and the labioscrotal folds are fused, with a single perineal opening; no gonads are palpable. Pelvic ultrasonography shows a uterus and ovaries. Serum sodium is 120 mEq/L, potassium is 7.2 mEq/L, glucose is 38 mg/dL, and bicarbonate is 14 mEq/L. Plasma renin activity and ACTH are increased, and serum 17-hydroxyprogesterone is markedly increased."], "q": "Which of the following enzymes is most likely deficient in this patient?", "o": ["11β-Hydroxylase", "17α-Hydroxylase", "3β-Hydroxysteroid dehydrogenase", "21-Hydroxylase", "Steroidogenic acute regulatory protein"], "k": "E"},
{"stem": ["A 68-year-old right-handed woman is brought to the emergency department 70 minutes after sudden difficulty speaking and right-sided weakness while preparing dinner. Her husband says she dropped a pot with her right hand and her mouth drooped. She was diagnosed with atrial fibrillation 2 months ago and has been taking apixaban “when she remembers.” She also has hypertension and hyperlipidemia.", "Blood pressure is 176/96 mm Hg and pulse is 112/min and irregularly irregular. She is awake. Speech is halting and effortful, with only a few words (“water... home... no”); she follows simple one-step commands, but repetition is impaired. Her gaze is deviated to the left. There is a right lower facial droop sparing the forehead. Strength is 1/5 in the right arm and 3/5 in the right leg. Pinprick sensation is decreased over the right face and arm. There is a right homonymous hemianopia. CT of the head shows no hemorrhage. CT angiography shows an abrupt cutoff of a vessel just beyond the terminal bifurcation of the left internal carotid artery; the medial surfaces of the frontal and parietal lobes are well perfused."], "q": "Occlusion of which of the following vessels best explains these findings?", "o": ["Left anterior cerebral artery", "Left middle cerebral artery", "Left posterior cerebral artery", "Lenticulostriate branches of the left middle cerebral artery", "Basilar artery"], "k": "C"},
{"stem": ["A 26-year-old man, a graduate student, comes to the clinic because of “weird episodes” over the past 18 months. Last year he had 10 days of pain behind his right eye that worsened with eye movements, with washed-out colors in that eye; vision recovered over 5 weeks without treatment. Eight months ago he had tingling and numbness of his left leg and lower trunk that resolved over a month. Two weeks ago, after a hot yoga class, he had temporary blurring of vision and clumsiness of his legs that resolved after a cool shower. He also feels electric shock sensations down his spine when he flexes his neck. He has had no fever, rash, joint pain, diarrhea, recent vaccination, or tick bites. His mother has hypothyroidism.", "Examination shows a mild right afferent pupillary defect, hyperreflexia in the legs, an extensor plantar response on the left, and decreased vibration sense at the ankles. Strength is normal. A brain MRI done last month showed multiple ovoid T2-hyperintense lesions in the periventricular white matter, perpendicular to the ventricles, as well as in the juxtacortical region and cerebellum. A lumbar puncture is performed."], "q": "Which of the following cerebrospinal fluid findings most strongly supports the underlying diagnosis?", "o": ["Elevated protein with normal cell count", "Marked neutrophilic pleocytosis with low glucose", "Xanthochromia", "Elevated 14-3-3 protein", "Oligoclonal IgG bands"], "k": "F"},
{"stem": ["A 49-year-old man comes to the clinic because of 8 months of worsening epigastric pain that radiates to the back, worsens after meals, and is partially relieved when he leans forward. He has lost 8 kg (17.6 lb). His stools are bulky, pale, greasy, and float; he often has to flush twice. Last month he was diagnosed with diabetes mellitus (hemoglobin A1c 8.2%) and started on metformin. He has had four episodes of acute pancreatitis in the past 6 years, each after heavy drinking. He drinks about six beers daily and smokes 1 pack of cigarettes daily. There is no family history of pancreatic disease.", "His BMI is 19 kg/m². There is mild epigastric tenderness. There is no jaundice. A CT scan of the abdomen shows a dilated main pancreatic duct, multiple coarse calcifications throughout the gland, and glandular atrophy. Stool examination with Sudan stain is positive for fat. Fecal elastase concentration is 60 μg/g (reference above 200)."], "q": "Which of the following is the most likely cause of this patient's steatorrhea?", "o": ["Loss of pancreatic acinar cells with decreased lipase secretion", "Decreased bile salt pool due to terminal ileal disease", "Gastric acid hypersecretion inactivating pancreatic lipase", "Deficiency of brush border lactase", "Bacterial overgrowth with deconjugation of bile salts"], "k": "B"},
{"stem": ["A 61-year-old man comes to the clinic because of 4 months of episodic facial flushing, watery diarrhea, and wheezing. The flushing starts suddenly, lasts 2 to 3 minutes, and is sometimes triggered by red wine or aged cheese. He thought he had a food allergy, but antihistamines did not help. He has lost 5 kg (11 lb). He has a 30-pack-year smoking history.", "Blood pressure is 118/72 mm Hg and pulse is 96/min. His face is flushed during the visit. There are scattered expiratory wheezes. A grade 2/6 holosystolic murmur is heard at the left lower sternal border and increases with inspiration. The liver edge is palpable 3 cm below the costal margin. A CT scan of the abdomen shows a 2.5-cm mass in the terminal ileum with mesenteric lymph node enlargement and multiple hypodense lesions in the liver. Echocardiography shows thickened tricuspid valve leaflets with regurgitation."], "q": "Which of the following is most likely to be elevated in a 24-hour urine collection from this patient?", "o": ["Vanillylmandelic acid", "Homovanillic acid", "5-Hydroxyindoleacetic acid", "Metanephrine", "Free cortisol"], "k": "D"},
{"stem": ["A 55-year-old man is brought to the emergency department after vomiting bright red blood twice. Over the past 2 days he has had nausea, early satiety, and dark stools. Eight months ago he was hospitalized for 6 weeks with necrotizing pancreatitis due to gallstones, complicated by a 10-cm pseudocyst in the pancreatic tail that was drained percutaneously. He had a cholecystectomy afterward. Since discharge he has had mild left upper quadrant discomfort and bloating. He drinks one glass of wine weekly. He has no history of hepatitis or jaundice.", "Blood pressure is 108/68 mm Hg and pulse is 104/min. He is pale. There is no jaundice, ascites, caput medusae, or spider angiomata. A firm mass is palpable below the left costal margin. Hemoglobin is 8.9 g/dL, platelet count is 85,000/mm³, INR is 1.0, and liver enzymes are within the reference range. Upper endoscopy shows large varices in the gastric fundus; the esophagus has no varices."], "q": "Thrombosis of which of the following vessels is most likely?", "o": ["Inferior mesenteric vein", "Short gastric veins", "Portal vein", "Splenic vein", "Left renal vein"], "k": "E"},
];

const LETTERS = ["A","B","C","D","E"];
const EXPL = {"1": {"ok": "Violaceous, nonblanching macules and plaques on the skin and <b>hard palate</b> in a man with untreated HIV and a CD4+ count below 200/mm³: <b>Kaposi sarcoma</b>, a vascular tumor of endothelial (lymphatic) origin. It is caused by <b>human herpesvirus 8</b> (KSHV), a gammaherpesvirus that stays latent and, with loss of immune surveillance, drives proliferation of spindle cells through viral proteins (vGPCR, viral IL-6) that promote angiogenesis and block apoptosis. The palate is a classic site, and lesions often follow skin lines. Treatment: restart antiretroviral therapy; chemotherapy for extensive disease.", "w": {"A": "CMV in advanced HIV causes retinitis, colitis and esophagitis, not violaceous skin plaques.", "B": "EBV causes oral hairy leukoplakia (white, nonremovable plaques on the lateral tongue) and primary CNS lymphoma in HIV.", "D": "HPV 16 causes anal and cervical carcinoma; low-risk types (6, 11) cause genital warts.", "E": "VZV causes painful vesicles in a dermatome (zoster), not painless purple plaques."}, "c": [["Violaceous skin/palate plaques in HIV with low CD4: diagnosis and virus?", "<b>Kaposi sarcoma</b>, caused by <b>HHV-8</b>."], ["Kaposi sarcoma: cell of origin and histology?", "<b>Endothelial</b> (lymphatic) cells; spindle cells forming slit-like vessels with extravasated RBCs."], ["Kaposi sarcoma vs bacillary angiomatosis?", "KS: <b>HHV-8</b>, lymphocytic infiltrate. Bacillary angiomatosis: <b>Bartonella</b>, neutrophilic infiltrate, treat with azithromycin/doxycycline."]]}, "2": {"ok": "Macrocytic anemia (MCV 114) with high homocysteine and a <b>normal neurologic exam</b> (vibration, position sense, Romberg) in a woman on long-term antiepileptic therapy for generalized seizures: <b>folate deficiency induced by phenytoin</b> (also valproate, carbamazepine, phenobarbital), which impairs folate absorption and metabolism. Poor diet makes it worse. Folate and B12 are both needed for DNA synthesis, so both cause megaloblastic anemia with ↑ homocysteine. The difference: <b>B12 deficiency also raises methylmalonic acid</b> and causes neurologic damage (subacute combined degeneration); folate deficiency does not. Treatment: folic acid supplementation.", "w": {"A": "Anemia of chronic disease is normocytic or microcytic, without high homocysteine.", "B": "Iron deficiency is microcytic (low MCV), and her periods are not heavy.", "C": "Pernicious anemia (B12 deficiency) usually causes neurologic findings, such as loss of vibration and position sense and a positive Romberg sign, and raises methylmalonic acid.", "E": "Dietary B12 deficiency is rare (strict vegans over years) because liver stores last 3–5 years, and it would also cause neurologic findings."}, "c": [["Phenytoin and anemia: which deficiency and type?", "<b>Folate deficiency</b> → megaloblastic (macrocytic) anemia."], ["Folate vs B12 deficiency: homocysteine and MMA?", "Folate: <b>↑ homocysteine, normal MMA</b>. B12: <b>↑ homocysteine and ↑ MMA</b>."], ["Macrocytic anemia with normal neuro exam: think?", "<b>Folate</b> deficiency (B12 deficiency causes subacute combined degeneration)."]]}, "3": {"ok": "He had <b>cryptorchidism</b> (undescended testis) corrected by orchiopexy in childhood. Cryptorchidism is the strongest risk factor for <b>testicular germ cell tumors</b> (seminoma is the most common). The risk is increased <b>even after orchiopexy</b> and also affects the normally descended testis to a smaller degree, which shows it reflects an intrinsic defect in the testis, not only its position. Early orchiopexy (ideally before 18 months) lowers the risk and improves fertility and allows the testis to be examined. He should be taught testicular self-examination. Cryptorchidism also increases the risk of infertility.", "w": {"A": "Epididymitis comes from infection (Chlamydia or gonorrhea in young men, E. coli in older men), not from cryptorchidism.", "B": "Hydrocele comes from a patent processus vaginalis (congenital) or local inflammation or trauma.", "D": "Torsion relates to the “bell clapper” deformity (poor fixation of the testis); orchiopexy fixes the testis in place.", "E": "Varicocele comes from dilation of the pampiniform plexus, more often on the left because the left gonadal vein drains into the left renal vein."}, "c": [["Strongest risk factor for testicular germ cell tumor?", "<b>Cryptorchidism</b> (risk persists even after orchiopexy)."], ["Cryptorchidism: complications?", "<b>Testicular cancer</b> (seminoma), <b>infertility</b>, torsion, inguinal hernia."], ["Cryptorchidism: when to do orchiopexy?", "By <b>6–18 months</b>; lowers cancer risk and improves fertility."]]}, "4": {"ok": "Absent breast development (thelarche depends on <b>ovarian estrogen</b>) with normal pubic and axillary hair (adrenarche depends on <b>adrenal androgens</b>) and <b>short stature</b>: <b>primary ovarian insufficiency</b>, most commonly from <b>Turner syndrome</b> (45,X) with streak gonads. The ovaries make neither estrogen nor inhibin B, so there is no negative feedback: <b>LH and FSH rise</b> (hypergonadotropic hypogonadism), with FSH usually the higher. Next step: karyotype. Look for associated findings: coarctation of the aorta, bicuspid aortic valve, horseshoe kidney.", "w": {"A": "Everything low is hypogonadotropic hypogonadism (Kallmann syndrome with anosmia, constitutional delay, anorexia or intense exercise); her sense of smell, diet and activity are normal.", "C": "High LH with low FSH does not fit ovarian failure: without inhibin B, FSH rises the most.", "D": "High estrogen would cause breast development, and she is Tanner 1.", "E": "High estrogen with high gonadotropins does not occur with nonfunctioning ovaries."}, "c": [["No breast development, normal pubic hair, short stature in a girl?", "<b>Turner syndrome</b> (primary ovarian insufficiency)."], ["Primary ovarian insufficiency: hormone profile?", "<b>↓ estrogen, ↓ inhibin B, ↑ LH, ↑ FSH</b> (hypergonadotropic hypogonadism)."], ["Thelarche vs adrenarche: which hormone drives each?", "Thelarche: <b>ovarian estrogen</b>. Pubic/axillary hair: <b>adrenal androgens</b>."]]}, "5": {"ok": "Toxic inhalation caused <b>diffuse alveolar damage</b> (ARDS): loss of type I pneumocytes and hyaline membranes. <b>Type I pneumocytes</b> are thin squamous cells covering about 95% of the alveolar surface for gas exchange, but they <b>cannot divide</b>. <b>Type II pneumocytes</b> are cuboidal cells that act as the <b>stem cells of the alveolar epithelium</b>: after injury they proliferate and differentiate into type I cells, restoring the gas-exchange surface. Their other high-yield function is producing <b>surfactant</b> (stored in lamellar bodies), which lowers surface tension.", "w": {"A": "Alveolar macrophages clear debris and pathogens; they do not rebuild epithelium.", "B": "Goblet cells secrete mucus in the bronchi, not in the alveoli.", "C": "Club cells regenerate the bronchiolar epithelium and detoxify via cytochrome P450, but not the alveolar lining.", "D": "Type I pneumocytes are the cells that were destroyed; they cannot divide."}, "c": [["Which cell regenerates the alveolar epithelium after injury?", "<b>Type II pneumocytes</b>."], ["Type II pneumocytes: two key functions?", "<b>Surfactant</b> production (lamellar bodies) and <b>regeneration</b> of type I cells."], ["Club (Clara) cells: function?", "Bronchiolar <b>regeneration</b>, secretion of protective proteins, <b>P450</b> detoxification."]]}, "6": {"ok": "A large (<b>thousands</b> of patients), <b>randomized, double-blind</b> trial comparing the new drug with the <b>current standard</b> (warfarin), after safety and efficacy were shown in earlier phases, done <b>before approval</b> to support the request to sell the drug: <b>phase III</b>. Its goal is to confirm efficacy and monitor adverse effects in a large population. Summary of phases: I (small number of <b>healthy volunteers</b>, safety and pharmacokinetics); II (small number of <b>patients</b>, efficacy and dosing); III (<b>many patients</b>, comparison with standard treatment or placebo, required for approval); IV (<b>after approval</b>, long-term and rare adverse effects).", "w": {"A": "Phase I tests safety, toxicity and pharmacokinetics in a small number of healthy volunteers.", "B": "Phase II tests efficacy and dosing in a small number of patients with the disease, which was the earlier study.", "D": "Phase IV happens after the drug is approved and on the market.", "E": "Post-marketing surveillance is phase IV, after approval, to detect rare or long-term adverse effects."}, "c": [["Large randomized trial vs standard therapy before approval: phase?", "<b>Phase III</b>."], ["Phases I and II: who and what?", "I: <b>healthy volunteers</b>, safety/PK. II: <b>small group of patients</b>, efficacy/dose."], ["Phase IV: when and why?", "<b>After approval</b>; rare and long-term adverse effects (post-marketing surveillance)."]]}, "7": {"ok": "Hypopigmented, finely scaling macules on the upper trunk that worsen in <b>heat and humidity</b> and stand out after tanning, with a KOH prep showing <b>“spaghetti and meatballs”</b> (short hyphae and yeast): <b>pityriasis (tinea) versicolor</b>, caused by <b>Malassezia</b>, a lipophilic yeast that is part of the <b>normal skin flora</b>. Azelaic acid made by the yeast inhibits tyrosinase, causing hypopigmentation. Because it is normal flora and only overgrows, it is <b>not contagious</b>: treat the <b>patient only</b>, with a <b>topical</b> antifungal (selenium sulfide or ketoconazole). Oral azoles are for extensive or refractory disease, and recurrences are common, so color may take months to return.", "w": {"A": "Oral fluconazole is for extensive or refractory disease, and treating contacts is unnecessary because it is not contagious.", "B": "Oral terbinafine does not work well for Malassezia in versicolor (it is used for dermatophytes such as onychomycosis).", "C": "Corticosteroids do not treat the fungus and can make fungal infections worse.", "D": "Selenium is correct, but contacts do not need treatment: Malassezia is normal skin flora."}, "c": [["KOH: “spaghetti and meatballs”?", "<b>Malassezia</b> → pityriasis (tinea) versicolor."], ["Tinea versicolor: why hypopigmented?", "<b>Azelaic acid</b> from Malassezia inhibits <b>tyrosinase</b>."], ["Tinea versicolor: first-line treatment and contacts?", "<b>Topical selenium sulfide</b> or ketoconazole; <b>patient only</b> (normal flora, not contagious)."]]}, "8": {"ok": "Loss of sensation over the <b>lateral lower leg and dorsum of the foot</b>, with the <b>first web space spared</b>, plus weak <b>eversion</b> only: injury to the <b>superficial fibular (peroneal) nerve</b> in the lateral compartment of the leg. It innervates the <b>fibularis longus and brevis</b> (evertors) and supplies skin of the lateral leg and most of the dorsum of the foot. The <b>deep fibular nerve</b> supplies the anterior compartment (dorsiflexion of the ankle and toes) and only the skin of the <b>first web space</b>, which is why that area is spared. Normal dorsiflexion excludes a common fibular nerve injury (which would cause foot drop). The sparing of the lateral border of the foot rules out the sural nerve, and his well-controlled diabetes without prior symptoms makes neuropathy unlikely.", "w": {"A": "Common fibular nerve injury (fibular neck) affects both branches: foot drop, loss of eversion and sensory loss including the first web space.", "B": "Deep fibular nerve injury causes weak dorsiflexion of the ankle and toes and numbness only in the first web space.", "C": "The sural nerve is purely sensory, for the lateral border of the foot and posterolateral leg, which is spared here.", "E": "Tibial nerve injury causes weak plantar flexion and inversion and loss of sensation of the sole."}, "c": [["Weak eversion + numb lateral leg and dorsum of foot, first web space spared?", "<b>Superficial fibular (peroneal) nerve</b>."], ["Deep fibular nerve: motor and sensory?", "<b>Dorsiflexion</b> of ankle and toes; sensation of the <b>first web space</b>."], ["Common fibular nerve injury at the fibular neck: findings?", "<b>Foot drop</b> (steppage gait), loss of <b>eversion</b>, numb lateral leg and dorsum of foot."]]}, "9": {"ok": "The key finding is <b>fixed, wide splitting of S2</b>: <b>atrial septal defect</b> (usually ostium secundum), which often presents only in adulthood with exertional dyspnea and atrial arrhythmias. The left-to-right shunt at the atrial level increases flow to the right side: <b>RV volume overload</b> (parasternal lift, incomplete RBBB, right axis deviation), increased pulmonary blood flow (larger pulmonary vascular markings) and <b>delayed pulmonic valve closure</b>. The split is fixed because the shunt equalizes atrial pressures throughout the respiratory cycle. The murmurs are flow murmurs, not from the defect: midsystolic across the <b>pulmonic valve</b> (left upper sternal border) and mid-diastolic across the <b>tricuspid valve</b> (left lower sternal border). Long-standing shunt can cause pulmonary hypertension and Eisenmenger syndrome. A transthoracic echo with bubble study confirms it.", "w": {"A": "Aortic regurgitation causes an early diastolic, high-pitched decrescendo murmur at the left sternal border and a wide pulse pressure; her pulse pressure is normal.", "C": "Mitral stenosis is the distractor from the childhood sore throats: it causes an opening snap and diastolic rumble at the apex, with left atrial enlargement, not a fixed split S2 or RV overload.", "D": "PDA causes a continuous “machine-like” murmur at the left infraclavicular area.", "E": "VSD causes a holosystolic murmur at the left lower sternal border, without fixed splitting of S2."}, "c": [["Fixed, wide splitting of S2?", "<b>Atrial septal defect</b>."], ["ASD: why the murmurs?", "↑ flow across the <b>pulmonic</b> (midsystolic, LUSB) and <b>tricuspid</b> (mid-diastolic, LLSB) valves."], ["ASD: ECG and complication?", "<b>Incomplete RBBB</b>, right axis deviation; risk of <b>pulmonary hypertension → Eisenmenger</b>, atrial arrhythmias, paradoxical emboli."]]}, "10": {"ok": "The triad of <b>recurrent infections</b>, <b>eczema</b> and <b>thrombocytopenia with small platelets</b> (petechiae, bloody stools) in a boy with an affected maternal uncle (<b>X-linked</b>): <b>Wiskott-Aldrich syndrome</b>. The mutation is in the <b>WAS gene</b>, whose protein (WASp) regulates the <b>actin cytoskeleton</b> in hematopoietic cells, so T cells cannot respond and reorganize properly and platelets are small and destroyed. Classic labs: <b>↓ IgM</b>, normal IgG, <b>↑ IgA and IgE</b>, low platelet count with low mean platelet volume. Infections are typically by encapsulated organisms (otitis, pneumonia). There is an increased risk of autoimmunity and lymphoma. Definitive treatment: hematopoietic stem cell transplant.", "w": {"A": "Defective class switching (CD40L, hyper-IgM syndrome) causes high IgM with low IgG, IgA and IgE, and opportunistic infections, without eczema or thrombocytopenia.", "B": "Defective NADPH oxidase is chronic granulomatous disease: infections by catalase-positive organisms (S. aureus, Aspergillus) and granulomas, without thrombocytopenia.", "C": "Impaired phagolysosome fusion (LYST) is Chédiak-Higashi: partial albinism, neuropathy and giant granules in neutrophils.", "E": "C2 deficiency causes lupus-like autoimmunity and infections by encapsulated organisms, without eczema or petechiae."}, "c": [["Eczema + recurrent infections + thrombocytopenia in a boy?", "<b>Wiskott-Aldrich syndrome</b> (X-linked)."], ["Wiskott-Aldrich: gene and function?", "<b>WAS</b> → protein that regulates the <b>actin cytoskeleton</b> of hematopoietic cells."], ["Wiskott-Aldrich: immunoglobulins and platelets?", "<b>↓ IgM</b>, normal IgG, <b>↑ IgA and IgE</b>; <b>small</b> platelets, low count."]]}, "11": {"ok": "Lymphatic drainage follows the embryologic origin of the organ. The testes develop in the <b>retroperitoneum near the kidneys (around L1–L2)</b> and descend into the scrotum carrying their blood vessels and lymphatics with them along the spermatic cord. So the testes drain to the <b>para-aortic (retroperitoneal, lumbar) lymph nodes</b>, near the origin of the gonadal arteries. This is why staging of testicular cancer requires a <b>CT of the abdomen and pelvis</b>, and why orchiectomy is done through an <b>inguinal</b> incision: a scrotal incision could open a new drainage route to the inguinal nodes. In contrast, the <b>scrotal skin</b> drains to the superficial inguinal nodes. The inguinal hernia repair and unprotected sex are distractors: they don't change the testicular drainage.", "w": {"A": "Deep inguinal nodes drain the glans penis and receive lymph from the superficial inguinal nodes.", "B": "External iliac nodes drain the bladder, prostate, upper vagina and cervix, and lower limb (via inguinal nodes).", "D": "Superficial inguinal nodes drain the scrotum, perineum and lower anal canal (below the pectinate line), not the testis.", "E": "Internal iliac nodes drain the prostate, lower rectum, upper vagina and cervix."}, "c": [["Testis: lymphatic drainage?", "<b>Para-aortic (retroperitoneal)</b> nodes."], ["Scrotum: lymphatic drainage?", "<b>Superficial inguinal</b> nodes."], ["Testicular mass: why inguinal (not scrotal) orchiectomy?", "Avoids creating a new drainage path to the <b>inguinal</b> nodes (tumor seeding)."]]}, "12": {"ok": "A young male heavy smoker with <b>distal limb ischemia</b> (ischemic pain, digital ulcers, toe gangrene), <b>Raynaud phenomenon</b> and <b>migratory superficial thrombophlebitis</b> (the tender red lumps along leg veins), with segmental occlusion of small and medium arteries and <b>corkscrew collaterals</b>: <b>thromboangiitis obliterans (Buerger disease)</b>. It is a segmental thrombosing vasculitis of small and medium arteries and veins, extending to nearby nerves (hence intense pain). The strongest association is <b>tobacco use</b>, and <b>smoking cessation</b> is the only intervention that reliably stops progression and prevents amputation. The normal lipids, glucose, ANA and antiphospholipid tests rule out atherosclerosis, scleroderma and APS.", "w": {"A": "Alcohol is not associated with Buerger disease.", "C": "Family history matters for atherosclerosis, which affects large proximal arteries at older ages and would show abnormal lipids or diabetes.", "D": "Cannabis can cause a similar “cannabis arteritis,” but tobacco remains by far the strongest and best established association.", "E": "Vibration causes hand-arm vibration syndrome (secondary Raynaud), not segmental arterial occlusions in the legs."}, "c": [["Young male smoker with digital gangrene, Raynaud and migratory phlebitis?", "<b>Thromboangiitis obliterans (Buerger disease)</b>."], ["Buerger disease: angiography?", "Segmental occlusions of small/medium arteries with <b>corkscrew collaterals</b>."], ["Buerger disease: treatment?", "<b>Smoking cessation</b> (the only intervention that halts progression)."]]}, "13": {"ok": "Fall on an outstretched hand with tenderness in the <b>anatomic snuffbox</b> (between the APL/EPB and EPL tendons) and pain with axial loading of the thumb: <b>scaphoid fracture</b>, the most commonly fractured carpal bone. Initial x-rays are often <b>normal</b>, so treat as a fracture (thumb spica splint) and repeat imaging (x-ray in 10–14 days or MRI). The scaphoid's blood supply comes from branches of the <b>radial artery</b> that enter at the distal end and flow <b>retrograde</b> to the proximal pole. A fracture at the waist interrupts this flow, so the proximal pole is at risk of <b>avascular necrosis</b> and <b>nonunion</b>. The radial artery itself runs in the floor of the snuffbox.", "w": {"A": "Hamate fracture (hook) occurs in golf, baseball or tennis players, with hypothenar pain and possible ulnar nerve injury.", "B": "The lunate is the most commonly dislocated carpal bone (risk of acute carpal tunnel syndrome), with pain over the center of the wrist, not the snuffbox.", "C": "The scaphoid is correct, but the ulnar artery does not supply it.", "E": "The trapezium is at the base of the thumb but is not the classic snuffbox fracture or the classic site of avascular necrosis."}, "c": [["Fall on outstretched hand + anatomic snuffbox tenderness?", "<b>Scaphoid fracture</b> (x-ray may be normal initially)."], ["Scaphoid: blood supply and complication?", "<b>Radial artery</b> branches, <b>retrograde</b> flow → <b>avascular necrosis</b> of the proximal pole, nonunion."], ["Suspected scaphoid fracture with normal x-ray: management?", "<b>Thumb spica splint</b> and repeat imaging (x-ray in 10–14 days or MRI)."]]}, "14": {"ok": "Exercise intolerance with <b>cramps early in exercise</b>, <b>myoglobinuria</b> (dark urine, dipstick positive for blood without RBCs), elevated CK, the <b>“second wind” phenomenon</b> (after a short rest, more glucose and fatty acids reach the muscle from the blood) and <b>no rise in lactate</b> during forearm exercise testing (with normal ammonia rise): <b>McArdle disease (glycogen storage disease type V)</b>, a deficiency of <b>muscle glycogen phosphorylase (myophosphorylase)</b>. Muscle cannot break down its own glycogen for energy during intense activity, so no lactate is produced. Because the liver is normal, blood glucose and the liver are normal. Inheritance is autosomal recessive. Management: avoid intense anaerobic exercise; take sucrose before exercise.", "w": {"B": "Glucose-6-phosphatase deficiency (von Gierke, type I) causes severe fasting hypoglycemia, lactic acidosis, hyperuricemia and hepatomegaly.", "C": "Acid α-glucosidase deficiency (Pompe, type II) causes cardiomegaly and hypotonia in infants, or proximal weakness in adults, not exercise cramps with no lactate rise.", "D": "Debranching enzyme deficiency (Cori, type III) causes milder hypoglycemia and hepatomegaly, with a normal lactate rise.", "E": "CPT II deficienc
