y causes myoglobinuria after prolonged exercise or fasting (fatty acid oxidation), without a second wind and with a normal lactate rise."}, "c": [["Exercise cramps + myoglobinuria + “second wind” + no lactate rise?", "<b>McArdle disease</b> (GSD type V)."], ["McArdle disease: deficient enzyme?", "<b>Muscle glycogen phosphorylase</b> (myophosphorylase)."], ["McArdle vs CPT II deficiency?", "McArdle: <b>short intense</b> exercise, second wind, no lactate rise. CPT II: <b>prolonged</b> exercise or fasting, normal lactate."]]}, "15": {"ok": "Fever with <b>hemolytic anemia</b> (low Hb, high reticulocytes, high LDH and indirect bilirubin, undetectable haptoglobin, dark urine) in an <b>asplenic</b> patient after summer outdoor activity in the <b>northeastern United States</b> (Nantucket, Massachusetts), with intraerythrocytic ring forms and <b>“Maltese cross” tetrads</b>, and no schizonts or gametocytes: <b>babesiosis</b>, caused by the protozoan <i>Babesia microti</i>. It is transmitted by the <b>Ixodes scapularis</b> (deer) tick, the same tick that transmits Lyme disease and anaplasmosis, so coinfection can occur. Asplenia, old age and immunosuppression cause severe disease. Treatment: <b>atovaquone + azithromycin</b> (exchange transfusion if severe).", "w": {"A": "Malaria also has intraerythrocytic rings, but he has not left the United States, and malaria does not form Maltese crosses; schizonts or gametocytes may be seen.", "B": "Ehrlichiosis (Amblyomma, lone star tick) shows morulae inside monocytes, not erythrocytes.", "C": "Lyme disease shares the same tick but causes erythema migrans, carditis or arthritis, not hemolysis with intraerythrocytic forms.", "D": "RMSF (Dermacentor) causes a rash that starts at the wrists and ankles and spreads centrally, without intraerythrocytic organisms."}, "c": [["Hemolytic anemia + Maltese cross tetrads in RBCs, northeastern US?", "<b>Babesiosis</b> (<i>Babesia microti</i>)."], ["Ixodes scapularis transmits which 3 infections?", "<b>Lyme disease</b>, <b>babesiosis</b>, <b>anaplasmosis</b>."], ["Babesiosis: risk factor for severe disease and treatment?", "<b>Asplenia</b>; <b>atovaquone + azithromycin</b>."]]}, "16": {"ok": "Marked leukocytosis with <b>myeloid cells at all stages of maturation</b>, <b>basophilia</b>, splenomegaly, few blasts, low leukocyte alkaline phosphatase and the <b>BCR::ABL1 fusion</b> (Philadelphia chromosome, t(9;22)): <b>chronic myeloid leukemia</b> in chronic phase. BCR::ABL1 encodes a <b>constitutively active tyrosine kinase</b> that drives proliferation. First-line treatment is a <b>tyrosine kinase inhibitor</b>: <b>imatinib</b>, which blocks the ATP-binding site of the BCR-ABL kinase (dasatinib and nilotinib are alternatives). Response is followed by BCR::ABL1 transcript levels (quantitative PCR). Resistance usually comes from point mutations in the kinase domain (T315I responds to ponatinib). Her work in radiology (ionizing radiation) is a risk factor, but does not change treatment.", "w": {"A": "All-trans retinoic acid treats acute promyelocytic leukemia, t(15;17), PML::RARA.", "B": "Hydroxyurea can lower the leukocyte count temporarily, but it does not target the cause and is not a definitive treatment.", "D": "Rituximab (anti-CD20) is for B-cell neoplasms, such as CLL and B-cell lymphomas.", "E": "Ruxolitinib (JAK1/2 inhibitor) is for myelofibrosis and polycythemia vera (JAK2 V617F)."}, "c": [["Leukocytosis with all stages of myeloid maturation + basophilia + splenomegaly?", "<b>Chronic myeloid leukemia</b>, BCR::ABL1, t(9;22)."], ["CML: first-line treatment and mechanism?", "<b>Imatinib</b>: inhibits the BCR-ABL <b>tyrosine kinase</b>."], ["CML vs leukemoid reaction: LAP score?", "CML: <b>low</b> LAP. Leukemoid reaction: <b>high</b> LAP."]]}, "17": {"ok": "Abrupt severe headache with nausea, visual loss, <b>ophthalmoplegia with ptosis</b> (cavernous sinus: CN III, IV, VI), and hypotension, hyponatremia and hypoglycemia (<b>acute adrenal insufficiency from loss of ACTH</b>), with a hemorrhagic sellar mass on MRI: <b>pituitary apoplexy</b>, hemorrhage or infarction of a pre-existing <b>pituitary adenoma</b>. The months of fatigue, low libido and weight gain suggest a prior adenoma with hypopituitarism. Hypertension and straining are precipitants. Management: <b>IV hydrocortisone immediately</b> (do not wait for imaging), fluids, and neurosurgical decompression if vision or consciousness is threatened.", "w": {"B": "Cavernous sinus thrombosis causes ophthalmoplegia and proptosis with fever and a facial or sinus infection; it does not produce a hemorrhagic sellar mass or adrenal crisis.", "C": "A Rathke cleft cyst is usually asymptomatic or causes slow compression; hemorrhage into it is a rare cause of apoplexy, far less likely than a pre-existing adenoma, given the hypopituitarism symptoms.", "D": "Pituitary metastases (breast, lung) are uncommon and typically cause diabetes insipidus and cranial nerve palsies gradually, with no known primary here.", "E": "Granulomatous infiltration (sarcoidosis, TB) is subacute, causing hypopituitarism and diabetes insipidus; it does not cause sudden hemorrhage."}, "c": [["Sudden headache + visual loss + ophthalmoplegia + hypotension?", "<b>Pituitary apoplexy</b> (hemorrhage or infarction of a pituitary adenoma)."], ["Why hypotension, hyponatremia and hypoglycemia in apoplexy?", "Loss of <b>ACTH</b> → <b>secondary adrenal insufficiency</b>; give IV hydrocortisone first."], ["Cavernous sinus nerves that can be hit by a sellar mass?", "<b>CN III, IV, V1, V2, VI</b> (and the internal carotid artery)."]]}, "18": {"ok": "Pain down the lateral leg to the dorsum of the foot and great toe, <b>weak great toe extension and ankle dorsiflexion (foot drop)</b>, inability to heel-walk, <b>preserved reflexes</b> and a positive straight-leg raise after lifting: <b>L5 radiculopathy</b> from a herniated disc (usually L4–L5, compressing the <b>traversing</b> L5 root). L5 supplies extensor hallucis longus, tibialis anterior and the evertors/hip abductors; there is no reflex that tests L5 (knee = L3–L4, ankle = S1). Absence of saddle anesthesia, retention or incontinence rules out <b>cauda equina syndrome</b>, which needs emergent MRI and surgery.", "w": {"A": "L3 radiculopathy causes anterior thigh pain, weak knee extension and a diminished knee-jerk.", "B": "L4 causes medial leg pain, weak knee extension and ankle dorsiflexion with a diminished patellar reflex; sensory loss is over the medial leg.", "D": "S1 causes weak plantar flexion (cannot toe-walk), loss of the ankle reflex and sensory loss over the lateral foot and sole.", "E": "S2 would give posterior thigh and calf symptoms; S2–S4 also control bladder, bowel and perineal sensation."}, "c": [["Foot drop + weak great toe extension + dorsum of foot numbness?", "<b>L5</b> radiculopathy (herniated L4–L5 disc)."], ["Reflexes: which roots do the knee and ankle jerk test?", "Knee: <b>L3–L4</b>. Ankle: <b>S1</b>. There is no L5 reflex."], ["Saddle anesthesia + urinary retention + bilateral leg weakness?", "<b>Cauda equina syndrome</b>: emergent MRI and decompression."]]}, "19": {"ok": "Edema, heavy proteinuria (4+, ratio 9), <b>hypoalbuminemia</b>, <b>hyperlipidemia</b>, a bland sediment (no blood, no casts) and normal C3 in a young child after an upper respiratory infection, with atopy: <b>nephrotic syndrome from minimal change disease</b>, the most common cause in children. Light microscopy and immunofluorescence are <b>normal</b>; <b>electron microscopy</b> shows <b>effacement of podocyte foot processes</b> (loss of the negative charge barrier → selective albuminuria). It is usually triggered by infection, atopy or NSAIDs, or lymphoma (Hodgkin) in adults. Treatment: <b>corticosteroids</b> (empiric in children, usually without biopsy); relapses are common.", "w": {"A": "Mesangial IgA deposits define IgA nephropathy, which causes gross hematuria 1–3 days after an infection (nephritic picture), not nephrotic syndrome.", "C": "Splitting and lamination of the basement membrane (“basket-weave”) is Alport syndrome: hematuria, hearing loss and eye defects.", "D": "Segmental scarring is focal segmental glomerulosclerosis, which is the most common nephrotic cause in Black adults and with HIV, heroin and obesity, and is steroid-resistant more often.", "E": "Subepithelial humps are poststreptococcal glomerulonephritis: nephritic syndrome with hematuria, hypertension and low C3 two weeks after a throat or skin infection."}, "c": [["Child with nephrotic syndrome, normal light microscopy: EM finding?", "<b>Effacement of podocyte foot processes</b> (minimal change disease)."], ["Minimal change disease: treatment and associations?", "<b>Corticosteroids</b>; infection, atopy, NSAIDs, <b>Hodgkin lymphoma</b> in adults."], ["Nephrotic vs nephritic syndrome: urinalysis?", "Nephrotic: <b>heavy proteinuria (>3.5 g/day)</b>, fatty casts, no RBCs. Nephritic: <b>hematuria with RBC casts</b>, hypertension."]]}, "20": {"ok": "Polyuria with <b>hypernatremia</b>, high plasma osmolality and <b>dilute urine that does not concentrate after water deprivation or desmopressin</b>, with <b>elevated ADH</b>, in a patient on long-term lithium: <b>nephrogenic diabetes insipidus</b>. Lithium enters collecting duct principal cells through ENaC and inhibits <b>GSK-3</b>, which <b>decreases aquaporin-2 expression</b> and the response to ADH. The kidney is resistant to ADH, so ADH levels are high. Other causes: hypercalcemia, hypokalemia, demeclocycline, and X-linked V2 receptor mutations. Treatment: stop the cause if possible, <b>thiazides</b> or <b>amiloride</b> (amiloride blocks lithium entry), and NSAIDs.", "w": {"A": "Central diabetes insipidus lowers ADH, and urine osmolality rises after desmopressin; here ADH is high and there is no response.", "B": "Hyperglycemia causes glucosuria and osmotic diuresis; glucose is normal and urine glucose is negative.", "C": "Primary polydipsia gives low plasma sodium and osmolality (water overload) and concentrates urine with water deprivation.", "D": "Her calcium is normal, so hypercalcemia does not explain the defect."}, "c": [["Polyuria, no response to water deprivation or desmopressin, high ADH?", "<b>Nephrogenic diabetes insipidus</b>."], ["How does lithium cause nephrogenic DI?", "Enters principal cells via <b>ENaC</b>, inhibits <b>GSK-3</b> → <b>↓ aquaporin-2</b>."], ["Treatment of lithium-induced nephrogenic DI?", "<b>Amiloride</b> (blocks lithium entry), thiazides, NSAIDs; stop lithium if possible."]]}, "21": {"ok": "Nephrotic syndrome in an adult (edema, 9.5 g/day proteinuria, hypoalbuminemia, hyperlipidemia, bland sediment) with a <b>diffusely thickened glomerular capillary wall without hypercellularity</b> on light microscopy: <b>membranous nephropathy</b>, the most common cause of primary nephrotic syndrome in white adults. About 70% of primary cases have <b>autoantibodies (IgG4) against the podocyte phospholipase A2 receptor (PLA2R)</b>, forming <b>subepithelial immune complexes</b>: the basement membrane builds “spikes” around them (silver stain), and EM shows subepithelial deposits. Secondary causes to look for: <b>solid tumors</b> (lung, colon; here, smoking and weight loss), hepatitis B/C, SLE, <b>NSAIDs</b>, penicillamine, gold. It carries a <b>risk of renal vein thrombosis</b> (lost antithrombin III in urine).", "w": {"A": "Crescents with parietal epithelial proliferation define rapidly progressive (crescentic) glomerulonephritis, with a nephritic picture and rapid loss of kidney function.", "B": "Mesangial IgA deposition is IgA nephropathy: hematuria after an infection, not nephrotic syndrome.", "D": "Subendothelial deposits with low complement are lupus nephritis and membranoproliferative glomerulonephritis; here C3 and C4 are normal and ANA is negative.", "E": "T-cell–mediated podocyte injury is minimal change disease: normal light microscopy, mostly children."}, "c": [["Adult nephrotic syndrome with thick capillary walls, no hypercellularity?", "<b>Membranous nephropathy</b>."], ["Primary membranous nephropathy: autoantibody and deposit location?", "<b>Anti-PLA2R</b> (IgG4); <b>subepithelial</b> immune complexes (“spike and dome” on silver stain)."], ["Secondary causes of membranous nephropathy?", "<b>Solid tumors</b>, hepatitis B/C, SLE, <b>NSAIDs</b>, penicillamine, gold; complication: <b>renal vein thrombosis</b>."]]}, "22": {"ok": "Advanced CKD (eGFR 18) with <b>low calcium, high phosphate, high PTH</b> and high alkaline phosphatase: <b>secondary hyperparathyroidism of CKD</b>. Failing kidneys <b>retain phosphate</b> and <b>cannot make 1,25-(OH)₂ vitamin D</b> (less 1α-hydroxylase), so intestinal calcium absorption falls and calcium drops; phosphate also binds calcium directly. The chronic hypocalcemia stimulates <b>parathyroid hyperplasia</b> and PTH secretion. Bone disease (renal osteodystrophy, osteitis fibrosa cystica) causes bone pain and proximal weakness. Treatment: <b>phosphate binders</b> with meals (sevelamer), restrict phosphate (colas, processed food), vitamin D analogs/calcimimetics (cinacalcet), and dialysis or parathyroidectomy if refractory.", "w": {"B": "A parathyroid adenoma (primary hyperparathyroidism) gives <b>high calcium</b> and low phosphate.", "C": "PTHrP from a tumor causes hypercalcemia with <b>suppressed PTH</b>.", "D": "Autoimmune destruction of chief cells (hypoparathyroidism) would give low PTH.", "E": "Osteolytic metastases raise calcium and suppress PTH."}, "c": [["CKD with low Ca, high phosphate, high PTH?", "<b>Secondary hyperparathyroidism</b>."], ["Why does CKD cause hypocalcemia?", "<b>Phosphate retention</b> + <b>↓ 1α-hydroxylase</b> (low calcitriol) → ↓ Ca absorption."], ["Primary vs secondary vs tertiary hyperparathyroidism: Ca?", "Primary: <b>↑ Ca</b>. Secondary: <b>↓ or normal Ca</b>. Tertiary: <b>↑ Ca</b> after long-standing secondary (autonomous glands)."]]}, "23": {"ok": "A newborn girl with <b>virilized genitalia</b> (46,XX with ovaries and uterus), <b>salt-wasting crisis</b> (hyponatremia, hyperkalemia, hypotension, hypoglycemia, acidosis), hyperpigmentation (high ACTH) and <b>markedly elevated 17-hydroxyprogesterone</b>: <b>21-hydroxylase deficiency</b>, the most common form of congenital adrenal hyperplasia (autosomal recessive, <i>CYP21A2</i>). Without 21-hydroxylase, cortisol and aldosterone are low, ACTH rises, and precursors are shunted to <b>androgens</b>. Low aldosterone causes the salt wasting; the brother likely died of the same crisis. Treatment: IV fluids, <b>hydrocortisone</b>, then glucocorticoid and <b>fludrocortisone</b> replacement.", "w": {"A": "11β-Hydroxylase deficiency also virilizes, but <b>deoxycorticosterone</b> excess causes <b>hypertension</b> and hypokalemia, not shock.", "B": "17α-Hydroxylase deficiency causes hypertension and hypokalemia, with <b>low</b> sex hormones: XX girls lack puberty and XY boys have ambiguous or female genitalia.", "C": "3β-HSD deficiency causes salt wasting but only mild virilization in girls, with ambiguous genitalia in boys, and high DHEA.", "E": "StAR deficiency (lipoid CAH) blocks all steroids: XY infants look female and both sexes have adrenal failure, with no virilization of an XX infant."}, "c": [["Virilized newborn girl + salt wasting + ↑ 17-OH-progesterone?", "<b>21-Hydroxylase deficiency</b>."], ["CAH: hypertension suggests which enzyme?", "<b>11β-</b> or <b>17α-hydroxylase</b> deficiency (excess mineralocorticoid precursors)."], ["Treatment of classic CAH?", "<b>Glucocorticoid</b> (hydrocortisone) + <b>fludrocortisone</b> if salt wasting."]]}, "24": {"ok": "An embolic stroke in a patient with poorly treated <b>atrial fibrillation</b>. Left hemisphere: <b>non-fluent (Broca) aphasia</b> with impaired repetition, right <b>face and arm &gt; leg</b> weakness and sensory loss (lateral motor/sensory homunculus), <b>gaze deviation toward the lesion</b> (frontal eye field), and right homonymous hemianopia (optic radiation): the <b>left middle cerebral artery (MCA)</b>. The medial frontal and parietal lobes (leg area) are supplied by the ACA, which is spared. Management: <b>IV thrombolysis (alteplase/tenecteplase) within 4.5 hours</b> if no contraindication, and thrombectomy for large vessel occlusion; BP must be below 185/110 before thrombolysis.", "w": {"A": "ACA stroke causes contralateral <b>leg</b> weakness more than arm, with abulia and urinary incontinence.", "C": "PCA stroke causes contralateral homonymous hemianopia with macular sparing, without weakness or aphasia (alexia without agraphia on the left).", "D": "Lenticulostriate occlusion causes a lacunar stroke in the internal capsule: pure motor or sensory deficit, without aphasia, hemianopia or gaze deviation.", "E": "Basilar occlusion causes coma, quadriparesis, cranial nerve and eye movement deficits, not a unilateral cortical syndrome with aphasia."}, "c": [["Aphasia + contralateral face/arm weakness + hemianopia + gaze toward lesion?", "<b>MCA</b> stroke."], ["ACA vs MCA stroke: weakness pattern?", "ACA: <b>leg</b> &gt; arm. MCA: <b>face and arm</b> &gt; leg."], ["Ischemic stroke: thrombolysis window and BP limit?", "Within <b>4.5 hours</b> of onset; BP <b>&lt; 185/110</b>."]]}, "25": {"ok": "Neurologic episodes <b>separated in time and space</b> (optic neuritis, sensory myelopathy), <b>Uhthoff phenomenon</b> (worse with heat), <b>Lhermitte sign</b>, an afferent pupillary defect, and <b>periventricular ovoid lesions perpendicular to the ventricles (Dawson fingers)</b>: <b>multiple sclerosis</b>, an autoimmune demyelination of the CNS (oligodendrocytes, T-cell and B-cell mediated). CSF shows <b>oligoclonal IgG bands</b> (and increased IgG index) with <b>mild lymphocytic pleocytosis</b> and normal or slightly raised protein. Acute relapse: <b>high-dose IV methylprednisolone</b>; long-term: disease-modifying therapy (ocrelizumab, natalizumab, interferon beta, glatiramer).", "w": {"A": "Albuminocytologic dissociation (high protein, normal cells) is Guillain-Barré syndrome, with ascending weakness and areflexia.", "B": "Neutrophilic pleocytosis with low glucose is bacterial meningitis (fever, neck stiffness).", "C": "Xanthochromia indicates subarachnoid hemorrhage (thunderclap headache).", "D": "CSF 14-3-3 protein supports Creutzfeldt-Jakob disease (rapid dementia, myoclonus)."}, "c": [["MS: characteristic CSF finding?", "<b>Oligoclonal IgG bands</b> + ↑ IgG index."], ["MS signs: worse with heat, shock down the spine on neck flexion?", "<b>Uhthoff phenomenon</b>; <b>Lhermitte sign</b>."], ["Acute MS relapse treatment?", "<b>High-dose IV methylprednisolone</b>."]]}, "26": {"ok": "Repeated alcoholic pancreatitis, epigastric pain radiating to the back, <b>pancreatic calcifications</b>, <b>steatorrhea</b>, weight loss and new <b>diabetes</b>: <b>chronic pancreatitis</b>. Fibrosis destroys <b>acinar cells</b>, so lipase, protease and amylase secretion fall; steatorrhea appears only when &gt; 90% of <b>lipase</b> output is lost, and the <b>fecal elastase</b> is low. Loss of islet cells causes (pancreatogenic, type 3c) diabetes. Treatment: <b>stop alcohol and smoking</b>, <b>pancreatic enzyme replacement</b> with meals, analgesia, insulin; fat-soluble vitamin supplements. Complications: pseudocysts, splenic vein thrombosis and <b>pancreatic adenocarcinoma</b>.", "w": {"B": "Terminal ileal disease (Crohn disease, resection) reduces bile salt reabsorption; he has no ileal disease, and the pancreas is calcified.", "C": "Acid hypersecretion that inactivates lipase is Zollinger-Ellison syndrome: peptic ulcers and diarrhea, with a normal pancreas.", "D": "Lactase deficiency causes watery, gassy diarrhea after dairy, not fat in stool.", "E": "Bacterial overgrowth causes steatorrhea through bile salt deconjugation but also B12 deficiency, and fecal elastase would be normal."}, "c": [["Chronic pancreatitis: classic triad?", "<b>Calcifications</b>, <b>steatorrhea</b>, <b>diabetes</b> (late)."], ["Low fecal elastase means?", "<b>Exocrine pancreatic insufficiency</b>."], ["Treatment of steatorrhea in chronic pancreatitis?", "<b>Pancreatic enzymes</b> with meals; abstain from alcohol."]]}, "27": {"ok": "Flushing, diarrhea, wheezing, <b>right-sided valvular disease</b> (tricuspid regurgitation) and a <b>terminal ileum mass with liver metastases</b>: <b>carcinoid syndrome</b> from a neuroendocrine tumor that secretes <b>serotonin</b>. Symptoms appear only after <b>liver metastases</b>, because the liver normally degrades serotonin (monoamine oxidase) from portal blood; the tumor then drains into the hepatic veins and the systemic circulation. Serotonin is metabolized to <b>5-HIAA</b> in urine, the diagnostic test. Heart disease is on the <b>right</b> because the lungs inactivate serotonin. Niacin deficiency (pellagra) may occur (tryptophan diverted to serotonin). Treatment: <b>octreotide</b> (somatostatin analog) and resection.", "w": {"A": "Vanillylmandelic acid is elevated in pheochromocytoma (episodic hypertension, headache, sweating) and neuroblastoma.", "B": "Homovanillic acid is elevated in neuroblastoma (dopamine metabolite) and pheochromocytoma.", "D": "Metanephrines are elevated in pheochromocytoma.", "E": "Free cortisol is elevated in Cushing syndrome (central obesity, striae, hypertension)."}, "c": [["Flushing + diarrhea + wheezing + tricuspid regurgitation?", "<b>Carcinoid syndrome</b>; test: urinary <b>5-HIAA</b>."], ["Why does carcinoid syndrome need liver metastases?", "The liver <b>degrades serotonin</b> from the portal blood; metastases release it into the systemic circulation."], ["Carcinoid syndrome: treatment and nutritional complication?", "<b>Octreotide</b>; <b>niacin deficiency</b> (pellagra)."]]}, "28": {"ok": "<b>Isolated gastric fundal varices</b> with a normal liver, splenomegaly (palpable left upper mass) and thrombocytopenia (hypersplenism) after necrotizing pancreatitis with a pseudocyst in the pancreatic tail: <b>splenic vein thrombosis</b> (“left-sided” or sinistral portal hypertension). The splenic vein runs along the posterior surface of the pancreas, so inflammation, pseudocysts or pancreatic cancer can thrombose it. Splenic outflow is blocked, and blood drains retrograde through the <b>short gastric veins</b> into the gastric fundus, forming varices, while the esophagus (left gastric vein, portal pressure normal) is spared. Treatment: <b>splenectomy</b> cures it.", "w": {"A": "The inferior mesenteric vein drains the left colon and rectum into the splenic vein; its thrombosis would not cause gastric varices.", "B": "Short gastric veins are the collateral channels that become varices; they are not the thrombosed vessel.", "C": "Portal vein thrombosis causes both esophageal and gastric varices; here the esophagus is spared, and the pancreatic tail pathology points to the splenic vein.", "E": "Left renal vein thrombosis causes flank pain, hematuria and left varicocele, not gastric varices."}, "c": [["Isolated gastric varices + splenomegaly after pancreatitis?", "<b>Splenic vein thrombosis</b> (sinistral portal hypertension)."], ["Treatment of varices from splenic vein thrombosis?", "<b>Splenectomy</b>."], ["Why is the esophagus spared in splenic vein thrombosis?", "Portal vein pressure is <b>normal</b>; blood drains via the <b>short gastric veins</b> to the fundus."]]}};

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmt(sec){ sec=Math.max(0,Math.round(sec)); const m=Math.floor(sec/60), s=sec%60; return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"); }
function score(){ let c=0; for(let i=0;i<N;i++) if(S.ans[i]===keyOf(i)) c++; return c; }

/* one orchestrated moment per screen: numbers count up, the score ring fills */
const RM = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function countUp(root){
  root.querySelectorAll("[data-to]").forEach(el => {
    const to = +el.dataset.to; if(RM || !to){ el.textContent = to; return; }
    const t0 = performance.now(), d = 900;
    const step = now => { const k = Math.min(1,(now-t0)/d), e = 1-Math.pow(1-k,3); el.textContent = Math.round(to*e); if(k<1) requestAnimationFrame(step); };
    el.textContent = 0; requestAnimationFrame(step);
  });
}
function fillRing(){
  const a = document.querySelector(".ring .arc"); if(!a) return;
  if(RM){ a.style.transition="none"; a.setAttribute("stroke-dashoffset", a.dataset.off); return; }
  requestAnimationFrame(() => requestAnimationFrame(() => a.setAttribute("stroke-dashoffset", a.dataset.off)));
}
function renderIntro(){
  stopClock();
  const mins = Math.round(LIMIT/60);
  app.innerHTML = `
  <main class="intro${window.__introDone?"":" reveal"}">
    <header class="banner">

      <div>
        <div class="eyebrow">Med in the USA</div>

    <section class="card">

      <ul class="facts">
        <li><b data-to="${N}">${N}</b><span>questões no estilo NBME</span></li>

        <li><b>A–E</b><span>uma resposta por questão</span></li>
        <li><b style="background:#F7FF3C;color:#111;padding:0 8px;border-radius:8px;width:max-content">Grifar</b><span>selecione um trecho do enunciado e toque em “Grifar”; toque no grifo para apagar</span></li>
      </ul>
    </section>
    <section class="card">
      <h2>Seu nome</h2>
      <label for="nome" class="gl">Nome completo</label>
      <input id="nome" class="namein" type="text" autocomplete="name" placeholder="Nome e sobrenome" value="${esc(myName())}">
      <p id="nmsg" class="gmsg" role="alert"></p>
      <h2 style="margin-top:18px">Como você quer fazer</h2>
      <div class="modes" role="radiogroup" aria-label="Modo">
        <label class="mode"><input type="radio" name="mode" id="mode-exam" value="exam" ${S.mode==="exam"?"checked":""}>
          <span><b>Modo prova</b><small>Cronômetro correndo, sem ver respostas. Nota e gabarito só no final do bloco.</small></span></label>
        <label class="mode"><input type="radio" name="mode" id="mode-tutor" value="tutor" ${S.mode==="tutor"?"checked":""}>
          <span><b>Modo estudo</b><small>Sem cronômetro. Você confirma cada resposta e vê na hora se acertou.</small></span></label>
      </div>
    </section>
    <div class="row">
      <button class="btn" id="start">Começar bloco</button>
      ${saved && !saved.finished && saved.phase==="exam" ? `<button class="btn ghost" id="resume">Continuar de onde parei</button><span class="resume">Questão ${saved.cur+1}${saved.mode==="tutor"?"":", "+fmt(LIMIT-saved.elapsed)+" restantes"}</span>` : ""}
      ${saved && saved.finished ? `<button class="btn ghost" id="last">Ver meu último resultado</button>` : ""}
    </div>
  </main>`;
  if(!window.__introDone){ countUp(app); window.__introDone = true; }
  app.querySelectorAll('input[name="mode"]').forEach(r => r.addEventListener("change", e => { S.mode = e.target.value; }));
  const nin = document.getElementById("nome");
  nin.addEventListener("input", () => { setName(nin.value); document.getElementById("nmsg").textContent=""; });
  document.getElementById("start").onclick = () => {
    const nm = nin.value.trim().replace(/\s+/g," ");
    if(nm.split(" ").length < 2){ document.getElementById("nmsg").textContent = "Digite seu nome e sobrenome para começar."; nin.focus(); return; }
    setName(nm);
    if(FS_OK) goFS(); const m=S.mode; S=fresh(); S.mode=m; S.nome=nm; S.phase="exam"; S.startedAt=Date.now(); save(); renderExam(); startClock(); };
  const rb = document.getElementById("resume"); if(rb) rb.onclick = () => { if(FS_OK) goFS(); S = saved; S.phase="exam"; renderExam(); startClock(); };
  const lb = document.getElementById("last"); if(lb) lb.onclick = () => { S = saved; S.phase="results"; renderResults(); };
}

function hlSetup(){

let labTab = "Serum", labQ = "";
function labRows(){
  const q = labQ.trim().toLowerCase();
  const tabs = q ? Object.keys(LABS) : [labTab];
  let html = "";
  tabs.forEach(t => {
    let rows = LABS[t];
    if(q){
      // keep a row if it matches; keep continuation rows under a matching parent; keep group headers with matches below
      const out = []; let parent = null, parentHit = false, sub = null;
      rows.forEach(r => {
        const [k,n,v] = r;
        if(k==="H"){ return; }
        if(k==="S"){ sub = r; parentHit = n.toLowerCase().includes(q); if(parentHit) out.push(r); return; }
        if(k==="c"){ if(parentHit) out.push(r); return; }
        const hit = (n+" "+(v||"")).toLowerCase().includes(q) || (sub && k==="i" && sub[1].toLowerCase().includes(q));
        parentHit = hit;
        if(hit){ if(sub && k==="i" && !out.includes(sub)) out.push(sub); out.push(r); }
      });
      if(!out.length) return;
      html += `<tr class="lh"><td colspan="2">${esc(t.toUpperCase())}</td></tr>`;
      rows = out;
    }
    rows.forEach(([k,n,v]) => {
      if(k==="H") html += `<tr class="lh"><td>${esc(n)}</td><td>Reference Range</td></tr>`;
      else if(k==="S") html += `<tr class="ls"><td colspan="2">${esc(n)}</td></tr>`;
      else html += `<tr class="l${k}"><td>${esc(n)}</td><td>${esc(v).replace(/^ {3}/,"&emsp;")}</td></tr>`;
    });
  });
  return html || `<tr><td colspan="2" class="lempty">Nenhum resultado para “${esc(labQ)}”.</td></tr>`;
}

        ${review?"":`<label class="markrow" for="mark"><input type="checkbox" id="mark" ${S.marked[i]?"checked":""}><span class="flagico">⚑</span> Marcar questão</label>`}
        ${questionHTML(i, review)}
      </article>
    </main>
    <footer class="botbar">
      ${review ? `<span class="clock">Revisão do bloco</span>` : `<span class="clock" id="clock">${S.mode==="tutor"?"Sem limite de tempo":"Tempo restante "+fmt(LIMIT-S.elapsed)}</span>`}
      <span class="spacer" style="flex:1"></span>
      ${review ? `<button class="tb" id="back">${ICON.end}<span class="lbl">Voltar ao resultado</span></button>`
               : `<button class="tb" id="pause">${ICON.pause}<span class="lbl">Pausar</span></button><button class="tb" id="end">${ICON.end}<span class="lbl">Encerrar bloco</span></button>`}
    </footer>
  </div>`;
  { // keep the existing sidebar nodes (arrows) untouched so they never flicker
    const oldRail = document.getElementById("rail");
    if(oldRail && app.querySelector(".exam") && !review){
      const t = document.createElement("template"); t.innerHTML = __html;
      const nr = t.content.getElementById("rail");
      oldRail.querySelector("#rlist ol").innerHTML = nr.querySelector("#rlist ol").innerHTML;
      oldRail.className = nr.className;
      nr.replaceWith(oldRail);
      app.replaceChildren(...t.content.childNodes);
    } else app.innerHTML = __html;
  }
  const go = j => { S.cur = j; save(); window.__qanim = true; renderExam(review); window.__qanim = false; document.getElementById("main").scrollTop = 0; };
  document.getElementById("prev").onclick = () => go(i-1);
  document.getElementById("next").onclick = () => go(i+1);
  app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { document.getElementById("rail").classList.remove("open"); go(+b.dataset.go); });
  document.getElementById("fzm").onclick = () => { if(fsIdx>0){ fsIdx--; applyFont(); } };
  document.getElementById("fzp").onclick = () => { if(fsIdx<FS_STEPS.length-1){ fsIdx++; applyFont(); } };
  applyFont();
  document.getElementById("labbtn").onclick = openLabs;
  const fsb = document.getElementById("fs"); if(fsb) fsb.onclick = () => isFS() ? exitFS() : goFS();
  { const r1=document.getElementById("rlist"); if(r1 && __st!=null) r1._st=__st; }
  { const cur = document.querySelector('.rail [aria-current="true"]'); const rail = document.getElementById("rlist"); if(cur && rail && rail._st!=null) rail.scrollTop = rail._st; if(cur && rail){ const rb=rail.getBoundingClientRect(), cb=cur.getBoundingClientRect(); if(cb.top<rb.top+30 || cb.bottom>rb.bottom-10) cur.scrollIntoView({block:"center"}); } }
  { const L=document.getElementById("rlist"); let hold=null; const __wired = !!L._wired; L._wired = true;
    const step = d => L.scrollBy({top:d*84, behavior:"smooth"});
    [["rup",-1],["rdown",1]].forEach(([id,d]) => { const b=document.getElementById(id);
      b.onclick = () => step(d);
      b.onpointerdown = () => { clearInterval(hold); hold=setInterval(()=>L.scrollBy({top:d*14}),40); };
      if(!__wired) ["pointerup","pointerleave","pointercancel"].forEach(ev => b.addEventListener(ev, () => clearInterval(hold))); });
    const upd = () => {};
    if(!__wired) L.addEventListener("scroll", upd); upd(); }
  document.getElementById("railbtn").onclick = () => { document.getElementById("rail").classList.toggle("open"); document.getElementById("rlist").dispatchEvent(new Event("scroll")); };
  if(review){ document.getElementById("back").onclick = () => { S.phase="results"; renderResults(); }; return; }
  document.getElementById("mark").onchange = e => { S.marked[i] = e.target.checked; save(); renderExam(); };
  app.querySelectorAll(`input[name="q${i}"]`).forEach(r => r.onchange = e => { S.ans[i] = +e.target.value; S.struck[i] = S.struck[i].filter(x=>x!==S.ans[i]); save(); keepScroll(()=>renderExam()); });
  app.querySelectorAll("[data-strike]").forEach(b => b.onclick = e => { e.preventDefault(); const j=+b.dataset.strike; const s=S.struck[i]; S.struck[i] = s.includes(j) ? s.filter(x=>x!==j) : s.concat(j); if(S.ans[i]===j && S.struck[i].includes(j)) S.ans[i]=null; save(); keepScroll(()=>renderExam()); });
  const sq = document.getElementById("submitq"); if(sq) sq.onclick = () => { S.revealed[i] = true; save(); keepScroll(()=>renderExam()); };
  document.getElementById("end").onclick = confirmEnd;
  document.getElementById("pause").onclick = pauseDialog;
}

function dialog(title, body, buttons){
  const v = document.createElement("div");
  v.className = "veil";
  v.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgt"><h3 id="dlgt">${title}</h3><p>${body}</p><div class="row">${buttons.map((b,n)=>`<button class="btn ${b.ghost?"ghost":""}" data-n="${n}">${b.label}</button>`).join("")}</div></div>`;
  document.body.appendChild(v);
  v.querySelectorAll("[data-n]").forEach(b => b.onclick = () => { v.remove(); buttons[+b.dataset.n].fn && buttons[+b.dataset.n].fn(); });
  v.querySelector("[data-n]").focus();
}
function confirmEnd(){
  const blank = S.ans.filter(a=>a===null).length;
  dialog("Encerrar o bloco?", blank ? `Você deixou ${blank} questão${blank>1?"ões":""} em branco. Depois de encerrar não dá para mudar as respostas.` : "Depois de encerrar não dá para mudar as respostas.",
    [{label:"Encerrar e ver nota", fn:finish},{label:"Continuar", ghost:true}]);
}
function pauseDialog(){
  stopClock();
  dialog("Bloco pausado", "O cronômetro parou. Suas respostas ficam guardadas neste navegador.", [{label:"Voltar ao bloco", fn:startClock}]);
}
function startClock(){
  stopClock();
  let last = Date.now();
  tick = setInterval(() => {
    const now = Date.now(); S.elapsed += (now-last)/1000; last = now;
    if(Math.floor(S.elapsed) % 5 === 0) save();
    if(S.mode==="tutor") return;
    const left = LIMIT - S.elapsed;
    const c = document.getElementById("clock");
    if(c){ c.textContent = "Tempo restante " + fmt(left); c.classList.toggle("low", left <= 120); }
    if(left <= 0){ stopClock(); finish(true); }
  }, 1000);
}
function stopClock(){ if(tick){ clearInterval(tick); tick = null; } }

function finish(timeout){
  stopClock(); if(isFS()) exitFS();
  S.finished = true; S.phase = "results"; if(S.mode!=="tutor") S.elapsed = Math.min(S.elapsed, LIMIT);
  save(); renderResults(timeout);
}

/* ---------- results ---------- */
function sendLink(){
  const c = score(), wrong=[], blank=[], marked=[];
  for(let i=0;i<N;i++){ const a=S.ans[i]; if(a===null) blank.push(i+1); else if(a!==keyOf(i)) wrong.push(i+1); if(S.marked[i]) marked.push(i+1); }
  const p = new URLSearchParams({ bloco:BLOCO, acertos:String(c), total:String(N), erradas:wrong.join(",")||"nenhuma", branco:blank.join(",")||"nenhuma", marcadas:marked.join(",")||"nenhuma",
    respostas:S.ans.map(a=>a===null?"-":LETTERS[a]).join(""), tempo:fmt(S.elapsed), modo:S.mode==="tutor"?"estudo":"prova", nome:(S.nome||myName()||"") });
  return SEND_URL + "?" + p.toString();
}
function renderResults(timeout){
  stopClock();
  const c = score(), pct = Math.round(100*c/N), blank = S.ans.filter(a=>a===null).length;
  const r = 52, circ = 2*Math.PI*r, off = circ*(1-c/N);
  const rows = Q.map((q,i)=>{
    const a=S.ans[i], k=keyOf(i);
    const pill = a===null ? `<span class="pill skip">Em branco</span>` : (a===k ? `<span class="pill ok">Acertou</span>` : `<span class="pill no">Errou</span>`);
    return `<tr><td class="n">${i+1}</td><td><button data-rev="${i}">Questão ${i+1}</button></td><td>${a===null?"—":LETTERS[a]}</td><td>${LETTERS[k]}</td><td>${pill}</td></tr>`;
  }).join("");
  app.innerHTML = `
  <main class="results">
    <header class="banner">
      <img src="${LOGO}" alt="Brasão da Med in the USA">
      <div><div class="eyebrow">Grand Rounds, Bloco 2</div><h1>Seu <mark>resultado</mark></h1>${timeout?`<p>O tempo acabou e o bloco foi encerrado.</p>`:""}</div>
    </header>
    <section class="card score">
      <svg class="ring" viewBox="0 0 132 132" role="img" aria-label="${c} de ${N} corretas">
        <circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--line)" stroke-width="12"/>
        <circle class="arc" cx="66" cy="66" r="${r}" fill="none" stroke="var(--good)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" data-off="${off}" transform="rotate(-90 66 66)"/>
        <text x="66" y="64" text-anchor="middle" font-size="30" font-weight="600">${pct}%</text>
        <text x="66" y="86" text-anchor="middle" font-size="13" fill="var(--muted)">${c} de ${N}</text>
      </svg>
      <div class="stats">
        <div><b>${c}</b><span>corretas</span></div>
        <div><b>${N-c-blank}</b><span>erradas</span></div>
        <div><b>${blank}</b><span>em branco</span></div>
        <div><b>${fmt(S.elapsed)}</b><span>${S.mode==="tutor"?"tempo de estudo":"tempo usado de "+fmt(LIMIT)}</span></div>
      </div>
    </section>
    <section class="card">
      <h2>Revisão questão a questão</h2>
      <div class="tbl-wrap"><table class="rev">
        <thead><tr><th>#</th><th>Questão</th><th>Sua</th><th>Certa</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </section>
    <section class="card send">
      <h2>Envie seu resultado para a mentoria</h2>
      <p>Assim as questões que a turma mais errou entram na aula do fim do mês. Na próxima tela seu nome já vem preenchido; se quiser, conte em quais questões teve mais dúvida e clique em “Enviar para a mentoria”.</p>
      <div class="row"><a class="btn" id="send" href="${sendLink()}" target="_blank" rel="noopener">${S.sent?"Enviar de novo":"Enviar meu resultado"}</a>${S.sent?`<span class="sent">✓ Formulário aberto. Confira se clicou em “Enviar para a mentoria” lá.</span>`:""}</div>
    </section>
    <div class="row">
      <button class="btn" id="rev0">Revisar minhas respostas</button>
      <button class="btn ghost" id="again">Refazer o bloco</button>
    </div>
  </main>`;
  fillRing();
  const openRev = i => { S.cur=i; S.phase="review"; renderExam(true); };
  app.querySelectorAll("[data-rev]").forEach(b => b.onclick = () => openRev(+b.dataset.rev));
  document.getElementById("rev0").onclick = () => openRev(0);
  document.getElementById("send").addEventListener("click", () => { S.sent = true; save(); setTimeout(()=>renderResults(), 300); });
  document.getElementById("again").onclick = () => { const m=S.mode; S=fresh(); S.mode=m; try{localStorage.removeItem(STORE_KEY);}catch(e){} renderIntro(); };
}

/* ---------- access code ---------- */
const CODE_HASH = "9f90ea67a301a0e1ab9cd0e9cd91d859207829da59e6a147611ba50e753821fc";
const UNLOCK_KEY = STORE_KEY + "-acesso";
async function sha(s){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
function unlocked(){ try{ return localStorage.getItem(UNLOCK_KEY)===CODE_HASH; }catch(e){ return false; } }
function renderGate(){
  app.innerHTML = `
  <main class="intro${window.__introDone?"":" reveal"}">
    <header class="banner">
      <img src="${LOGO}" alt="Brasão da Med in the USA">
      <div><div class="eyebrow">Med in the USA</div><h1>Grand <mark>Rounds</mark></h1><p>Acesso exclusivo para mentorados.</p></div>
    </header>
    <section class="card">
      <h2>Código de acesso</h2>
      <form id="gate" class="gate" autocomplete="off">
        <label for="code" class="gl">Digite o código que você recebeu do Paulo.</label>
        <div class="row"><input id="code" class="codein" type="text" inputmode="text" autocapitalize="characters" spellcheck="false" aria-describedby="gmsg"><button class="btn" type="submit">Entrar</button></div>
        <p id="gmsg" class="gmsg" role="alert"></p>
      </form>
    </section>
  </main>`;
  const f = document.getElementById("gate"), inp = document.getElementById("code"), msg = document.getElementById("gmsg");
  inp.focus();
  f.onsubmit = async e => {
    e.preventDefault();
    const h = await sha(inp.value.trim().toUpperCase().replace(/\s+/g,""));
    if(h===CODE_HASH){ try{ localStorage.setItem(UNLOCK_KEY, CODE_HASH); }catch(err){} renderIntro(); }
    else { msg.textContent = "Esse código não está certo. Confira com o Paulo e tente de novo."; inp.select(); }
  };
}

if(unlocked()) renderIntro(); else renderGate();
})();
</script>
