<meta charset="utf-8">
<title>Grand Rounds Bloco 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap">
<style>
/* Layout: qbank shell - navy command bar on top, question rail on the left, one question per screen on a cream sheet */
:root{
  --sky:#AFE1FA; --bg:#F1F7FB; --sheet:#FFFFFF; --cream:#FAF6EB; --navy:#0E2149; --ink:#17264A;
  --muted:#51607E; --line:#C7DBEA; --rail:#F4F9FD; --bar:#0E2149; --bar-ink:#FAF6EB;
  --good:#1D7A4C; --good-bg:#E3F4EA; --bad:#B42D24; --bad-bg:#FBE8E6; --flag:#C8102E; --focus:#2C7FB8;
  --sel:#DDEFFB;
  --display:"DM Serif Display", Georgia, "Times New Roman", serif;
  --text:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --ui:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --ease:cubic-bezier(.22,.8,.24,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky:#7CC8EE; --bg:#0A1428; --sheet:#111E3A; --cream:#1A2A4E; --navy:#E9F2FA; --ink:#DCE7F3;
  --muted:#9FB0CC; --line:#2A3C63; --rail:#0E1A33; --bar:#061027; --bar-ink:#FAF6EB;
  --good:#5FD39A; --good-bg:#12382A; --bad:#FF8A80; --bad-bg:#3F1A1C; --flag:#FF6B7F; --focus:#7CC8EE; --sel:#1E3A63;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --sky:#7CC8EE; --bg:#0A1428; --sheet:#111E3A; --cream:#1A2A4E; --navy:#E9F2FA; --ink:#DCE7F3;
  --muted:#9FB0CC; --line:#2A3C63; --rail:#0E1A33; --bar:#061027; --bar-ink:#FAF6EB;
  --good:#5FD39A; --good-bg:#12382A; --bad:#FF8A80; --bad-bg:#3F1A1C; --flag:#FF6B7F; --focus:#7CC8EE; --sel:#1E3A63;
  color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.55;margin:0;-webkit-font-smoothing:antialiased;letter-spacing:-.003em}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.ui{font-family:var(--ui)}
.muted{color:var(--muted)}

/* ---------- intro ---------- */
.intro{max-width:980px;margin:0 auto;padding-block:28px 72px;padding-inline:16px;display:grid;gap:20px}
.banner{background:var(--sky);color:#0E2149;border-radius:28px;padding:clamp(36px,6vw,64px) clamp(20px,5vw,56px) clamp(32px,5vw,52px);display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;position:relative;overflow:hidden}
.banner img{width:clamp(84px,11vw,112px);height:auto;flex:none;margin-bottom:10px}
.banner .eyebrow{font:600 17px/1.3 var(--ui);letter-spacing:-.01em;opacity:.75}
.banner h1{font-family:var(--display);font-weight:400;font-size:clamp(56px,10vw,104px);line-height:.98;letter-spacing:-.015em;margin:.04em 0 .12em;text-wrap:balance}
.banner h1 mark{background:linear-gradient(transparent 55%,#FAF6EB 55%,#FAF6EB 92%,transparent 92%);color:inherit;padding:0 6px}
.banner p{margin:0;font:500 clamp(18px,2.4vw,23px)/1.35 var(--ui);letter-spacing:-.01em;color:#21365F}
.gl{display:block;font:400 16px/1.5 var(--ui);color:var(--muted);margin:0 0 10px}
.namein{font:400 18px/1.2 var(--ui);padding:15px 18px;border:1px solid #C6D4E1;border-radius:14px;background:#FFFFFF;color:var(--ink);width:min(480px,100%);transition:border-color .2s,box-shadow .2s}
.namein:focus{outline:none;border-color:#2C7FB8;box-shadow:0 0 0 4px rgba(175,225,250,.7)}
.gate .gl{display:block;font:400 16px/1.5 var(--ui);color:var(--muted);margin:0 0 10px}
.codein{font:600 19px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;padding:15px 18px;border:1px solid #C6D4E1;border-radius:14px;background:#FFFFFF;color:var(--ink);width:min(300px,100%);transition:border-color .2s,box-shadow .2s}
.codein:focus{outline:none;border-color:#2C7FB8;box-shadow:0 0 0 4px rgba(175,225,250,.7)}
.gmsg{color:var(--bad);font:500 14px/1.4 var(--ui);min-height:1.4em;margin:10px 0 0}
.card{background:var(--sheet);border:0;border-radius:24px;padding:clamp(24px,4vw,40px)}
.card h2{font:700 clamp(24px,3vw,30px)/1.15 var(--ui);letter-spacing:-.02em;margin:0 0 18px;color:var(--navy)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:0;padding:0;list-style:none}
.facts li{padding:4px 22px 4px 0;margin-right:22px;border-right:1px solid var(--line)}
.facts li:last-child{border-right:0;margin-right:0}
.facts b{display:block;font:700 clamp(34px,5vw,52px)/1.05 var(--ui);letter-spacing:-.035em;color:var(--navy);font-variant-numeric:tabular-nums;margin-bottom:6px}
.facts span{font:400 15px/1.4 var(--ui);color:var(--muted)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:#E6EEF5;border-radius:16px;max-width:640px}
.mode{display:block;position:relative;border-radius:12px;padding:14px 16px;cursor:pointer;transition:background .25s var(--ease),box-shadow .25s var(--ease)}
.mode:has(input:checked){background:#FFFFFF;box-shadow:0 1px 2px rgba(14,33,73,.08),0 4px 14px rgba(14,33,73,.08)}
.mode:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.mode input{position:absolute;opacity:0;pointer-events:none}
.mode b{font:600 17px/1.3 var(--ui);letter-spacing:-.01em;color:var(--navy);display:block}
.mode small{font:400 14px/1.4 var(--ui);color:var(--muted);display:block;margin-top:2px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{font:600 17px/1 var(--ui);letter-spacing:-.01em;border-radius:980px;padding:16px 28px;border:0;background:#0E2149;color:#FFFFFF;cursor:pointer;transition:background .2s var(--ease),transform .2s var(--ease)}
.btn:hover{background:#1D3A70}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:#0E2149;box-shadow:inset 0 0 0 1.5px #0E2149}
.btn.ghost:hover{background:rgba(14,33,73,.06)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.resume{font:400 14px/1.4 var(--ui);color:var(--muted)}

/* ---------- exam shell ---------- */
.exam{display:grid;grid-template-columns:104px 1fr;grid-template-rows:auto minmax(0,1fr) auto;height:100vh;height:100dvh;min-height:0;overflow:hidden}
#app{min-height:100%}
.topbar{grid-column:1/-1;position:relative;background:var(--bar);color:var(--bar-ink);display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap;font-family:var(--ui)}
.topbar .item{border:1px solid rgba(250,246,235,.55);border-radius:4px;padding:4px 10px;font-size:13px;line-height:1.35;font-variant-numeric:tabular-nums}
.topbar .spacer{flex:1}
.tb{background:transparent;border:0;color:var(--bar-ink);display:flex;flex-direction:column;align-items:center;gap:2px;font:500 12.5px/1 var(--ui);padding:6px 8px;border-radius:6px;cursor:pointer;min-width:62px}
.tb:hover{background:rgba(250,246,235,.12)}
.tb svg{width:22px;height:22px}
.tb:disabled{opacity:.35;cursor:not-allowed}
.counter{font:600 18px/1 var(--ui);font-variant-numeric:tabular-nums;padding:0 6px}
.rail{background:var(--rail);border-right:1px solid var(--line);font-family:var(--ui);min-height:0;display:flex;flex-direction:column;overflow:hidden}
.rlist{flex:1;min-height:0;overflow-y:scroll;overscroll-behavior:contain}
.rail .rarrow{justify-content:center;flex:none;border:0;background:var(--navy);color:var(--sheet);font:600 12px/1 var(--ui);padding:7px 0;cursor:pointer;width:100%}
.rail .rarrow:disabled{opacity:.3;cursor:default}
.rlist,.main{scrollbar-width:auto;scrollbar-color:#8A9BB8 transparent}
.rlist::-webkit-scrollbar,.main::-webkit-scrollbar{width:12px}
.rlist::-webkit-scrollbar-track,.main::-webkit-scrollbar-track{background:color-mix(in srgb,var(--line) 45%,transparent)}
.rlist::-webkit-scrollbar-thumb,.main::-webkit-scrollbar-thumb{background:#8A9BB8;border-radius:8px;border:3px solid transparent;background-clip:padding-box;min-height:40px}
.rlist::-webkit-scrollbar-thumb:hover,.main::-webkit-scrollbar-thumb:hover{background:#0E2148;background-clip:padding-box}
.rail h3{font:600 13px/1.3 var(--ui);text-align:center;margin:10px 4px 6px;color:var(--muted)}
.rail ol{list-style:none;margin:0;padding:0}
.rail button{width:100%;display:flex;align-items:center;gap:6px;padding:7px 10px;border:0;background:transparent;cursor:pointer;font:500 14px/1 var(--ui);font-variant-numeric:tabular-nums;color:var(--ink)}
.rail li:nth-child(even) button{background:color-mix(in srgb,var(--line) 35%,transparent)}
.rail li button[aria-current="true"],.rail li:nth-child(even) button[aria-current="true"]{background:var(--navy);color:var(--sheet)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;border:1.5px solid currentColor}
.dot.done{background:currentColor}
.dot.ok{background:var(--good);border-color:var(--good)}
.dot.no{background:var(--bad);border-color:var(--bad)}
.rail .fl{color:var(--flag);margin-left:auto;font-size:12px}
.main{overflow-y:auto;min-height:0;padding-block:22px 40px;padding-inline:16px}
.sheet{font-size:calc(17.5px * var(--qs,1));max-width:860px;margin:0 auto;background:var(--sheet);border:0;border-radius:22px;padding:28px clamp(18px,4vw,44px) 34px;box-shadow:0 1px 2px rgba(14,33,73,.05)}
.prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(175,225,250,.18)}
.prog i{display:block;height:100%;background:#AFE1FA;border-radius:0 3px 3px 0;transition:width .45s var(--ease)}
@media (prefers-reduced-motion:no-preference){
  .sheet.enter{animation:qin .32s var(--ease)}
  @keyframes qin{from{opacity:0;transform:translate(var(--dx,0px),var(--dy,8px))}to{opacity:1;transform:none}}
  .intro.reveal>*{animation:rise .6s var(--ease) both}
  .intro.reveal>*:nth-child(2){animation-delay:.08s}
  .intro.reveal>*:nth-child(3){animation-delay:.16s}
  .intro.reveal>*:nth-child(4){animation-delay:.24s}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
}
.markrow{display:flex;align-items:center;gap:8px;font:500 14px/1 var(--ui);margin-bottom:18px;color:var(--ink)}
.markrow input{width:17px;height:17px;accent-color:var(--flag)}
.flagico{color:var(--flag)}
.stem p{margin:0 0 1em}
.labs{border-collapse:collapse;margin:4px 0 18px;font-size:.94em;min-width:280px}
.labs caption{text-align:left;font-weight:700;margin-bottom:6px;color:var(--navy)}
.labs td{padding:5px 18px 5px 0;border-bottom:1px dotted var(--line);font-variant-numeric:tabular-nums}
.figure{margin:6px 0 20px}
.figure img{display:block;max-width:100%;width:440px;height:auto;border-radius:6px;border:1px solid var(--line)}
.figure img.wide{width:100%;background:#fff}
.figure figcaption{font:400 12px/1.4 var(--ui);color:var(--muted);margin-top:6px}
.labpanel{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:#DCE1EE;color:#111;z-index:40;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.28);font-family:Arial,Helvetica,sans-serif}
.labhead{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;background:#fff}
.labhead input{flex:1;font:16px Arial,Helvetica,sans-serif;padding:9px 10px;border:1px solid #8a8a8a;border-radius:2px;color:#111;background:#fff}
.labx{background:#1E4A78;color:#fff;border:0;border-radius:6px;width:42px;height:40px;font-size:22px;cursor:pointer;flex:none}
.labtabs{display:flex;gap:2px;padding:0 10px;background:#fff;border-bottom:1px solid #b9c0d0;flex-wrap:wrap}
.labtabs button{font:15px Arial,Helvetica,sans-serif;padding:8px 10px;border:1px solid #b9c0d0;border-bottom:0;background:#fff;color:#111;cursor:pointer;border-radius:3px 3px 0 0;margin-bottom:-1px}
.labtabs button[aria-selected="true"]{background:#DCE1EE;font-weight:700}
.labscroll{flex:1;overflow-y:auto;min-height:0}
.labtbl{width:100%;border-collapse:collapse;font-size:15px;line-height:1.35}
.labtbl td{padding:9px 8px;border-bottom:1px solid #b9c0d0;vertical-align:top}
.labtbl td:first-child{width:46%}
.labtbl tr.lh td{font-weight:700;padding-top:12px}
.labtbl tr.lh td:last-child{text-align:center}
.labtbl tr.ls td{font-weight:700;font-style:italic}
.labtbl tr.li td:first-child{padding-left:28px}
.labtbl .lempty{text-align:center;color:#555;padding:24px}
#labbtn[aria-pressed="true"]{background:rgba(250,246,235,.18)}
.fz{display:flex;align-items:center;gap:2px}
.fz button{background:transparent;border:1px solid rgba(250,246,235,.5);color:var(--bar-ink);font:700 14px/1 var(--ui);padding:7px 9px;border-radius:6px;cursor:pointer;min-width:38px}
.fz button:disabled{opacity:.35;cursor:default}
.fz .big{font-size:18px}
.tblogo{height:46px;width:auto;flex:none;background:#E8F3FB;border-radius:10px;padding:3px 6px}
@media (max-width:640px){.tblogo{height:36px;padding:2px 4px}}
.qtitle{font-weight:700;color:var(--navy);margin:6px 0 16px}
mark.hl{background:#F7FF3C;color:#111;border-radius:2px;padding:0 1px;cursor:pointer;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hlbtn{position:fixed;z-index:30;background:#0E2148;color:#FAF6EB;border:2px solid #F7FF3C;border-radius:8px;padding:8px 14px;font:600 14px/1 var(--ui);box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
.hint{font:400 13px/1.4 var(--ui);color:var(--muted);margin:-6px 0 14px}
.opts{border:1px solid #C6D4E1;border-radius:16px;padding:6px;max-width:660px;margin:0;list-style:none}
.opt{display:grid;grid-template-columns:auto auto 1fr auto;align-items:start;gap:10px;padding:10px 14px;border-radius:11px;transition:background .2s var(--ease)}
.opt:hover{background:#F3F8FC}
.opt:has(input:checked){background:var(--sel)}
.opt input{width:19px;height:19px;margin-top:4px;accent-color:var(--navy)}
.opt label{display:contents;cursor:pointer}
.opt .L{font-weight:600}
.opt.struck .txt,.opt.struck .L{text-decoration:line-through;color:var(--muted)}
.strike{background:transparent;border:0;color:var(--muted);font:500 13px/1 var(--ui);text-decoration:line-through;cursor:pointer;padding:5px 4px;border-radius:4px}
.strike:hover{color:var(--ink)}
.opt.correct{background:var(--good-bg)}
.opt.correct .L,.opt.correct .txt{color:var(--good);font-weight:700}
.opt.wrong{background:var(--bad-bg)}
.opt.wrong .L,.opt.wrong .txt{color:var(--bad)}
.pct{font:500 12.5px/1.8 var(--ui);color:var(--muted);font-variant-numeric:tabular-nums}
.actions{margin-top:18px}
.verdict{margin-top:22px;border-left:5px solid var(--good);background:var(--good-bg);padding:12px 16px;border-radius:4px;font-family:var(--ui);font-size:15px}
.verdict.no{border-color:var(--bad);background:var(--bad-bg)}
.verdict b{font-size:16px}
.expl{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
.expl h4{font:700 15px/1.3 var(--ui);color:var(--navy);margin:0 0 8px}
.expl p{margin:0 0 .8em}
.expl .ans{color:var(--good);font-weight:700}
.botbar{grid-column:1/-1;background:var(--bar);color:var(--bar-ink);display:flex;align-items:center;gap:12px;padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));font-family:var(--ui);flex-wrap:wrap}
.clock{border:1px solid rgba(250,246,235,.55);border-radius:4px;padding:6px 12px;font:500 14px/1.2 var(--ui);font-variant-numeric:tabular-nums}
.clock.low{background:#B42D24;border-color:#B42D24}

.send{background:#0E2149;color:#EAF4FB}
.send h2{color:#FFFFFF}
.send .btn{background:#AFE1FA;color:#0E2149}
.send .btn:hover{background:#CDEDFC}
.send .sent{color:#AFE1FA}
.send p{margin:0 0 14px;font-family:var(--ui);font-size:15px}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.sent{font:500 14px/1.4 var(--ui);color:var(--good)}
/* ---------- dialog ---------- */
.veil{position:fixed;inset:0;background:rgba(6,16,39,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;padding:16px;z-index:10}
.dlg{background:var(--sheet);color:var(--ink);border-radius:22px;padding:24px;max-width:440px;width:100%;font-family:var(--ui);border:1px solid var(--line)}
.dlg h3{margin:0 0 8px;font:600 19px/1.3 var(--ui);color:var(--navy)}
.dlg p{margin:0 0 18px;font-size:15px}

/* ---------- results ---------- */
.results{max-width:900px;margin:0 auto;padding-block:26px 48px;padding-inline:16px;display:grid;gap:20px}
.score{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.ring{width:148px;height:148px}
.ring .arc{transition:stroke-dashoffset 1.1s var(--ease)}
.ring text{font-family:var(--ui);fill:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stats div{background:var(--bg);border-radius:16px;padding:14px 16px}
.stats b{display:block;font:700 30px/1.1 var(--ui);letter-spacing:-.03em;color:var(--navy);font-variant-numeric:tabular-nums}
.stats span{font:400 14px/1.3 var(--ui);color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table.rev{border-collapse:collapse;width:100%;font-family:var(--ui);font-size:14px}
table.rev th{text-align:left;font-weight:600;color:var(--muted);font-size:14px;border-bottom:1px solid var(--line);padding:8px}
table.rev td{border-bottom:1px solid var(--line);padding:9px 8px;vertical-align:top}
table.rev td.n{font-variant-numeric:tabular-nums;width:40px}
table.rev button{background:transparent;border:0;color:var(--navy);text-decoration:underline;cursor:pointer;padding:0;text-align:left;font:500 14px/1.4 var(--ui)}
.pill{display:inline-block;font:600 12px/1 var(--ui);padding:5px 8px;border-radius:999px}
.pill.ok{background:var(--good-bg);color:var(--good)}
.pill.no{background:var(--bad-bg);color:var(--bad)}
.pill.skip{background:var(--cream);color:var(--muted)}

@media (max-width:640px){
  .facts{grid-template-columns:1fr 1fr;row-gap:18px}
  .facts li:nth-child(2n){border-right:0;margin-right:0}
  .modes{grid-template-columns:1fr}
  .exam{grid-template-columns:1fr}
  .rail{display:none}
  .rail.open{display:flex;position:fixed;top:0;bottom:0;left:0;width:120px;z-index:5;box-shadow:4px 0 18px rgba(0,0,0,.25)}
  .tb span.lbl{display:none}
  .tb{min-width:40px}
  .score{grid-template-columns:1fr;justify-items:start}
  body{font-size:16px}
}
@media (min-width:641px){ .only-mobile{display:none} }
@media (prefers-reduced-motion:no-preference){ .opt{transition:background .15s} }

/* ---- refinamentos: toque, contraste, transparência, movimento ---- */
button,.opt,.mode,label,.btn,.rail li button,.strike{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.opt{transition:background .2s var(--ease),transform .15s var(--ease)}
.opt:active{background:var(--sel);transform:scale(.995)}
.rail li button{transition:background .15s var(--ease),transform .15s var(--ease)}
.rail li button:active{transform:scale(.97)}
.tb:active,.fz button:active,.strike:active,.rail .rarrow:active{transform:scale(.94);opacity:.85}
.tb,.fz button,.strike,.rail .rarrow{transition:background .2s var(--ease),transform .15s var(--ease),opacity .15s}
.mode:active{transform:scale(.99)}
@media (pointer:coarse){
  .fz button{min-height:44px;min-width:44px}
  .tb{min-height:44px;min-width:44px}
  .rail .rarrow{padding:12px 0}
  .strike{min-width:44px;min-height:44px}
  .opt{padding-block:12px}
}
@media (prefers-contrast:more){
  :root{--muted:#2B3A57;--line:#7C93AE}
  .opts,.namein,.codein{border-color:#4B607C}
  .opt .L,.pct{color:var(--ink)}
}
@media (prefers-reduced-transparency:reduce){
  .veil{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(6,16,39,.82)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
  .opt:active,.rail li button:active,.tb:active,.fz button:active,.btn:active,.mode:active{transform:none}
  .prog i,.ring .arc{transition:none}
  .sheet.enter{animation:rfade .15s linear}
  @keyframes rfade{from{opacity:0}to{opacity:1}}
}

/* Lab Values ancorado ao botao */
@media (prefers-reduced-motion:no-preference){
  .labpanel{transform-origin:var(--ox,100%) var(--oy,0)}
  .labpanel.pop-in{animation:labin .28s var(--ease) both}
  .labpanel.pop-out{animation:labout .2s var(--ease) both;pointer-events:none}
  @keyframes labin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
  @keyframes labout{from{opacity:1;transform:none}to{opacity:0;transform:scale(.6)}}
}

 "A 34-year-old woman comes to the emergency department because of chest pain that began 6 hours ago. The pain is sharp, retrosternal, and radiates to the trapezius ridges. It worsens when she takes a deep breath or lies on her back and improves when she leans forward. Ten days ago, she had rhinorrhea, myalgias, and a low-grade fever that resolved without treatment. She takes an oral contraceptive and has no other medical history.",
 "Temperature is 37.8°C, blood pressure is 122/76 mm Hg, pulse is 104/min, and respirations are 18/min. The lungs are clear to auscultation. Cardiac examination shows a high-pitched, scratchy sound heard best at the left sternal border with the patient leaning forward. There is no jugular venous distension, and there is no lower extremity edema."],
 q:"Which of the following electrocardiographic findings is most likely in this patient?",
 o:["Diffuse concave ST-segment elevation with PR-segment depression","Low QRS voltage with beat-to-beat variation in QRS amplitude","S wave in lead I with Q wave and inverted T wave in lead III","Short PR interval with slurred upstroke of the QRS complex","ST-segment elevation in V1–V4 with reciprocal inferior ST depression"], k:"B", },
{ stem:[
 "A 29-year-old woman comes to the clinic because of daily headaches and a rhythmic \"swishing\" sound in her left ear for the past 6 weeks. The sound is synchronous with her pulse and is louder at night. At a health fair last month, her blood pressure was 162/100 mm Hg. She has no family history of hypertension, does not smoke, and takes no medications. She has not had fever, weight loss, joint pain, or rash.",
 "Blood pressure is 164/102 mm Hg in the right arm and 160/100 mm Hg in the left arm. Pulses are equal and symmetric in all four extremities. A bruit is heard over the left side of the neck and another in the right upper abdominal quadrant, lateral to the midline. Neurologic examination shows no abnormalities. Erythrocyte sedimentation rate is within normal limits.",
 "Catheter angiography shows alternating areas of narrowing and dilation in the middle and distal segments of the right renal artery, producing a beaded appearance. The ostium is spared. A similar pattern is seen in the mid-cervical portion of the left internal carotid artery."],
 img:{src:"F", alt:"Renal artery angiogram showing alternating segments of narrowing and dilation", credit:"Imagem: Zeina AR, Vladimir W, Barmeir E. / Wikimedia Commons, CC BY 2.0"},
 q:"Which of the following is the most likely diagnosis?",
 o:["Takayasu arteritis","Atherosclerotic renal artery stenosis","Fibromuscular dysplasia","Polyarteritis nodosa","Granulomatosis with polyangiitis"], k:"D", },
{ stem:[
 "A 10-month-old boy is brought to the physician because of his fourth episode of acute otitis media in 3 months. He was also hospitalized 6 weeks ago for pneumonia, and <i>Streptococcus pneumoniae</i> grew from his blood cultures at that time. He was well until about 6 months of age. His growth has slowed over the past 2 months. His mother says her brother died of \"a severe infection\" when he was a toddler. He has received all recommended vaccinations.",
 "He is at the 10th percentile for weight. Temperature is 38.4°C. The right tympanic membrane is bulging and erythematous. The tonsils are not visible, and no cervical, axillary, or inguinal lymph nodes are palpable. There is no hepatosplenomegaly."],
 labs:[["Serum IgG","markedly decreased"],["Serum IgA","undetectable"],["Serum IgM","markedly decreased"],["CD19+ B lymphocytes","absent"],["CD3+ T lymphocytes","normal"]],
 q:"Which of the following is the most likely underlying cause of this patient's condition?",
 o:["Adenosine deaminase deficiency causing toxic accumulation of deoxyadenosine in lymphocytes","Absent CD40 ligand on activated helper T cells","Failure of development of the third and fourth pharyngeal pouches","Defective tyrosine kinase required for pre-B cell maturation in the bone marrow","Defective NADPH oxidase in phagocytes"], k:"E", },
{ stem:[
 "A 58-year-old man comes to the physician because of a dull ache in the right upper abdomen, loss of appetite, and a 6-kg weight loss over the past 3 months. He feels full after eating only small amounts. He emigrated from Southeast Asia 20 years ago and was told many years ago that he had \"a chronic liver infection\" acquired at birth, but he never received follow-up. He does not drink alcohol.",
 "He appears thin. The sclerae are mildly icteric. Abdominal examination shows shifting dullness and a firm, nodular liver edge palpable 5 cm below the right costal margin. There is no peripheral edema.",
 "Contrast-enhanced CT scan of the abdomen shows a 7-cm mass in the right hepatic lobe that enhances intensely in the arterial phase and becomes hypodense relative to the surrounding liver in the portal venous phase. Biopsy shows malignant polygonal cells arranged in thickened trabeculae, with focal bile production."],
 q:"Which of the following serum markers is most likely to be elevated in this patient?",
 o:["Alpha-fetoprotein","CA 19-9","Carcinoembryonic antigen","CA 125","β-hCG"], k:"B", },
{ stem:[
 "A 3-year-old girl is brought to the emergency department because of fever for 7 days that has not responded to acetaminophen. She has been very irritable and refuses to walk. Over the past few days, her parents have noticed that both of her eyes are red, her lips are dry and cracked, and her hands and feet are swollen. She has no cough or diarrhea.",
 "Temperature is 39.2°C, pulse is 140/min, and blood pressure is 96/60 mm Hg. Examination shows bilateral conjunctival injection without exudate, a bright red tongue with prominent papillae, and fissured lips. A single tender, 2-cm lymph node is palpable in the right anterior cervical chain. There is diffuse erythema and edema of the palms and soles, and a blanching, erythematous maculopapular rash covers the trunk. Cardiac examination shows tachycardia without murmurs.",
 "Echocardiography shows dilation of the proximal left anterior descending coronary artery. A photograph of the patient's face is shown."],
 img:{src:"K", alt:"Face of a young child with erythematous patches on the cheeks and red, swollen, cracked lips", credit:""},
 q:"Which of the following best explains the development of this patient's cardiac finding?",
 o:["Transmural inflammation of medium-sized arteries with destruction of the internal elastic lamina","Immune complex deposition causing leukocytoclastic vasculitis of small vessels","Granulomatous inflammation restricted to the aorta and its major branches","Antibodies against streptococcal antigens cross-reacting with cardiac myosin","Subendothelial lipid accumulation forming fibrofatty plaques"], k:"B", },
{ stem:[
 "An 81-year-old woman comes to the physician because of shortness of breath with exertion for 6 months. Last week she nearly fainted while climbing a flight of stairs, and she has had pressure-like chest discomfort while carrying groceries that resolves with rest. She has hypertension and hyperlipidemia. She had no known heart problems as a child or young adult.",
 "Pulse is 76/min, and blood pressure is 132/84 mm Hg. The carotid upstrokes are weak and delayed. Cardiac examination shows a grade 3/6, harsh, late-peaking crescendo-decrescendo systolic murmur heard best at the right upper sternal border that radiates to both carotid arteries. The second heart sound is soft and single. The lungs are clear.",
 "Echocardiography shows a trileaflet aortic valve with heavily calcified, immobile cusps and a markedly reduced valve area. The commissures are not fused. There is concentric left ventricular hypertrophy."],
 q:"Which of the following is the most likely cause of this patient's valvular disease?",
 o:["Commissural fusion following rheumatic inflammation","Dystrophic calcification of the cusps from cumulative mechanical stress","Congenitally bicuspid valve with turbulent flow","Deposition of amyloid fibrils within the valve leaflets","Bacterial vegetations destroying the valve cusps"], k:"C", },
{ stem:[
 "A 64-year-old man comes to the physician because of fatigue and a 7-kg weight loss over the past 5 months. He has had intermittent constipation alternating with loose stools and a dull discomfort in the right upper abdomen. He has never undergone cancer screening. He has type 2 diabetes mellitus. He does not drink alcohol and has no history of hepatitis.",
 "He appears pale. The abdomen is soft, and a firm, nontender, irregular liver edge is palpable 4 cm below the right costal margin. Test of the stool for occult blood is positive."],
 labs:[["Hemoglobin","9.6 g/dL"],["Mean corpuscular volume","71 μm³"],["Alkaline phosphatase","240 U/L"],["Alpha-fetoprotein","within normal limits"]],
 after:["CT scan of the abdomen shows numerous round, hypodense lesions of varying sizes scattered throughout both hepatic lobes. Biopsy of one of the lesions shows malignant tall columnar cells forming glands, with central areas of necrotic debris.", "A photograph of the cut surface of a liver from a patient with similar findings is shown."],
 img:{src:"L", alt:"Cut surface of a liver with numerous pale, rounded nodules of varying size, several with central depression", credit:""},
 q:"Which of the following is the most likely primary source of this patient's liver lesions?",
 o:["Hepatocellular carcinoma","Colorectal adenocarcinoma","Cholangiocarcinoma","Pancreatic adenocarcinoma","Signet ring cell gastric carcinoma"], k:"C", },
{ stem:[
 "A 74-year-old man is brought to the emergency department after two episodes of sudden lightheadedness while working in his garden today. During the second episode, he had to sit on the ground to avoid falling. He had an anterior wall myocardial infarction 3 years ago. His medications include aspirin, atorvastatin, and lisinopril; he does not take β-adrenergic blockers or calcium channel blockers.",
 "Pulse is 44/min and irregular, and blood pressure is 94/58 mm Hg. He is alert but appears fatigued. The lungs are clear, and there is no jugular venous distention.",
 "A rhythm strip is shown."],
 img:{src:"E", alt:"ECG rhythm strip showing regular P waves, a constant PR interval in conducted beats, and a P wave that is not followed by a QRS complex", credit:""},
 q:"Which of the following is the most likely diagnosis?",
 o:["First-degree atrioventricular block","Second-degree atrioventricular block, Mobitz type I","Second-degree atrioventricular block, Mobitz type II","Third-degree (complete) atrioventricular block","Sick sinus syndrome"], k:"D", },
{ stem:[
 "A 74-year-old woman comes to the physician because of a new headache over her left temple for 4 weeks. The scalp on that side feels sore when she brushes her hair, and her jaw becomes painful after a few minutes of chewing, forcing her to stop eating. Two days ago, the vision in her left eye went dark for about 5 minutes and then returned to normal. For several months, she has had stiffness in her shoulders and hips that is worst in the morning. She has lost 3 kg without trying.",
 "Temperature is 37.6°C. The left temporal artery is tender, thickened, and nodular, with a diminished pulse. Visual acuity is normal, and funduscopic examination shows no abnormalities. Erythrocyte sedimentation rate is 96 mm/h.",
 "Biopsy of the left temporal artery shows transmural infiltration by lymphocytes and macrophages with multinucleated giant cells and fragmentation of the internal elastic lamina."],
 q:"Which of the following best describes the pathogenesis of this patient's vascular disease?",
 o:["Antineutrophil cytoplasmic antibodies activating neutrophils in small-vessel walls","Complement activation by circulating immune complexes deposited in vessel walls","Eosinophil-mediated necrotizing inflammation of small and medium-sized vessels","Lipid accumulation beneath the intima forming atheromatous plaques","T cell–mediated granulomatous inflammation driven by cytokine release"], k:"F", },
{ stem:[
 "A 27-year-old woman comes to the physician because of an intensely itchy rash on her left wrist for 3 days. The rash appeared 2 days after she began wearing a new metal-clasp watch that she received as a gift. She had a similar, milder reaction to inexpensive earrings several years ago. She has no fever, joint pain, or other skin lesions, and takes no medications.",
 "Examination shows a sharply demarcated, erythematous, edematous plaque with small vesicles and areas of weeping and crusting on the dorsal left wrist, in a band-like distribution matching the location of the watch clasp. The rest of the skin and mucous membranes are normal.",
 "Biopsy of the lesion shows intercellular edema of the epidermis and a perivascular infiltrate of mononuclear cells in the superficial dermis."],
 q:"Which of the following best describes the immunologic mechanism responsible for this patient's condition?",
 o:["Sensitized T cells releasing cytokines that recruit and activate macrophages","IgE-mediated mast cell degranulation","Immune complex deposition with complement activation","Autoantibodies against keratinocyte adhesion proteins","Antibody-dependent cellular cytotoxicity mediated by natural killer cells"], k:"B", },
{"stem": ["A 34-year-old man comes to the physician because of episodes of pounding headache, palpitations, and drenching sweats over the past 4 months. The episodes last 10 to 20 minutes and occur several times weekly. His brother underwent thyroidectomy for a thyroid tumor at age 30 years.", "Blood pressure is 138/88 mm Hg; during an episode in the office, it rises to 196/112 mm Hg. Plasma free metanephrines are markedly increased. CT scan of the abdomen shows a 4-cm left adrenal mass."], "q": "The cells that give rise to this patient's adrenal tumor share an embryologic origin with which of the following?", "o": ["Cells of the adrenal zona glomerulosa", "Follicular cells of the thyroid gland", "Hepatocytes", "Melanocytes of the skin", "Somatotrophs of the anterior pituitary gland"], "k": "E"},
{"stem": ["A 6-year-old boy is brought to the emergency department because of a painful, swollen left knee 3 hours after he fell from his bicycle. He had prolonged bleeding after a tooth extraction last year. His maternal uncle requires regular infusions for a bleeding disorder.", "The left knee is warm, tense, and tender, with limited range of motion. There are several bruises of different ages on the shins."], "labs": [["Platelets", "260,000/mm³"], ["Prothrombin time", "12 sec"], ["Partial thromboplastin time", "74 sec"], ["Bleeding time", "4 min (N=2–7)"]], "after": ["The prolonged partial thromboplastin time corrects after mixing with normal plasma."], "q": "Which of the following steps of coagulation is most likely directly impaired in this patient?", "o": ["Activation of factor X by the tissue factor–VIIa complex", "Activation of factor X by the factor IXa–VIIIa complex", "Binding of platelet glycoprotein Ib to von Willebrand factor", "Cleavage of fibrinogen to fibrin by thrombin", "Cross-linking of fibrin by factor XIIIa"], "k": "C"},
{"stem": ["A 5-year-old boy is brought to the physician because of recurrent skin abscesses and pneumonia since infancy, several of which required hospitalization. His parents also report that he bruises easily and is sensitive to bright light.", "He has fair skin and silvery-gray hair, unlike his parents. Examination shows horizontal nystagmus, mild hepatosplenomegaly, and decreased vibratory sensation in both feet."], "labs": [["Leukocytes", "2,900/mm³ (neutrophils 32%)"], ["Platelets", "180,000/mm³"]], "after": ["A peripheral blood smear shows large, peroxidase-positive cytoplasmic inclusions in granulocytes."], "q": "This patient's condition is most likely caused by a defect in which of the following processes?", "o": ["Assembly of the NADPH oxidase complex", "Expression of the β2 integrin subunit on leukocytes", "Microtubule-dependent lysosomal trafficking and phagolysosome fusion", "Myeloperoxidase-mediated production of hypochlorous acid", "Signaling through the interleukin-12/interferon-γ pathway"], "k": "D"},
{"stem": ["A 58-year-old woman comes to the physician for follow-up after an episode of right flank pain caused by a kidney stone 2 months ago. She reports fatigue, constipation, and aching in her legs. A DEXA scan shows a T-score of −2.7 at the distal radius."], "labs": [["Calcium", "11.6 mg/dL"], ["Phosphorus", "2.2 mg/dL"], ["Parathyroid hormone", "148 pg/mL (N=10–65)"], ["25-Hydroxyvitamin D", "normal"], ["24-hour urine calcium", "increased"]], "q": "The effect of this patient's hormonal abnormality on bone is mediated primarily by which of the following?", "o": ["Increased osteoblast expression of RANK-L with decreased osteoprotegerin", "Direct binding of the hormone to receptors on osteoclasts", "Increased calcitonin release from parafollicular cells", "Increased osteoblast deposition of osteoid", "Inhibition of renal 1α-hydroxylase"], "k": "B"},
{"stem": ["A 46-year-old man is brought to the emergency department 18 hours after drinking an unknown liquid from an unlabeled container in his garage. He reports nausea, abdominal pain, and blurred vision that he describes as \"looking through a snowstorm.\"", "Pulse is 112/min, respirations are 30/min and deep, and blood pressure is 118/74 mm Hg. Pupils are dilated and react sluggishly to light. Funduscopic examination shows hyperemia and edema of both optic discs."], "labs": [["Sodium", "140 mEq/L"], ["Chloride", "101 mEq/L"], ["Bicarbonate", "9 mEq/L"], ["Urea nitrogen", "14 mg/dL"], ["Glucose", "90 mg/dL"], ["Serum osmolality", "328 mOsm/kg H₂O"], ["Arterial pH", "7.18"]], "q": "Ingestion of which of the following is the most likely cause of this patient's condition?", "o": ["Acetylsalicylic acid", "Ethanol", "Ethylene glycol", "Isopropyl alcohol", "Methanol"], "k": "F"},
{"stem": ["A 34-year-old woman at 31 weeks' gestation comes to the physician because of numbness and tingling of her right hand for 6 weeks. The symptoms wake her at night, and she relieves them by shaking her hand. She has also been dropping small objects while buttoning her clothes.", "Examination shows decreased sensation over the palmar surfaces of the thumb, index finger, and middle finger. Sensation over the skin of the thenar eminence and the dorsum of the hand is normal. There is weakness of thumb abduction and opposition. Flexion of the distal interphalangeal joints of the index finger and thumb is normal. Holding both wrists in full flexion for 60 seconds reproduces her symptoms."], "q": "Compression of a nerve at which of the following sites best explains these findings?", "o": ["Between the two heads of the pronator teres muscle", "Deep to the flexor retinaculum at the wrist", "Within the cubital tunnel at the elbow", "Within the ulnar (Guyon) canal at the wrist", "Along the spiral groove of the humerus"], "k": "C"},
{"stem": ["A 19-year-old man is diagnosed with metastatic nonseminomatous germ cell tumor of the testis. He begins a combination chemotherapy regimen consisting of bleomycin, etoposide, and cisplatin."], "q": "Which of the following best describes the mechanism of action of etoposide?", "o": ["Stabilization of the topoisomerase II–DNA cleavage complex, preventing strand religation", "Binding to β-tubulin, preventing microtubule polymerization", "Formation of covalent intrastrand cross-links between guanine bases", "Generation of oxygen free radicals that cause DNA strand breaks", "Inhibition of topoisomerase I, causing single-strand DNA breaks"], "k": "B"},
{"stem": ["A 26-year-old man comes to the physician because of a 4-month history of bloody diarrhea with mucus. He has 6 to 8 small-volume bowel movements daily, often with urgency and a sensation of incomplete evacuation, and he wakes at night to defecate. He has lost 4 kg (8.8 lb) during this period. Over the past month, he has also had intermittent redness and aching of his right eye. He has not traveled recently and has not taken antibiotics.", "Temperature is 37.8°C (100°F), pulse is 92/min, and blood pressure is 116/72 mm Hg. The abdomen is soft with mild tenderness in the left lower quadrant. There are no perianal skin tags or fistulas. Rectal examination shows bright red blood mixed with stool."], "labs": [["Hemoglobin", "10.8 g/dL"], ["Erythrocyte sedimentation rate", "48 mm/h"], ["Stool culture", "negative"], ["Stool ova and parasites", "negative"], ["Clostridioides difficile toxin", "negative"]], "after": ["A barium enema is shown. Biopsy specimens obtained at subsequent colonoscopy show crypt abscesses and distorted crypt architecture without granulomas."], "img": {"src": "U", "alt": "Barium enema showing a narrowed, smooth, featureless descending and sigmoid colon without haustral markings", "credit": ""}, "q": "This patient is at greatest risk for which of the following conditions?", "o": ["Calcium oxalate nephrolithiasis", "Enterovesical fistula", "Megaloblastic anemia from vitamin B12 malabsorption", "Primary sclerosing cholangitis", "Strictures of the terminal ileum"], "k": "E"},
{"stem": ["A 7-week-old girl is brought to the physician because of a red lesion on her abdomen. Her parents first noticed a faint pink patch when she was 2 weeks old; since then, it has become raised, bright red, and larger. She was born at term after an uncomplicated pregnancy, and she is feeding and growing well.", "Examination shows a 2.5-cm, soft, compressible, bright red, lobulated plaque just above the umbilicus that partially blanches with pressure. There are no other skin lesions. The remainder of the examination shows no abnormalities. A photograph of the lesion is shown."], "img": {"src": "H", "alt": "Raised, bright red, lobulated plaque on the abdomen of an infant", "credit": "Foto: Zeimusu / Wikimedia Commons, domínio público"}, "q": "Which of the following best describes the expected course of this lesion?", "o": ["Growth in proportion to the child with persistence throughout life", "Progressive darkening and nodularity during adulthood", "Transformation into a malignant vascular tumor", "Development of platelet trapping with consumptive coagulopathy", "Rapid growth over several months followed by slow spontaneous regression"], "k": "F"},
{"stem": ["A 29-year-old woman comes to the physician because of fatigue and shortness of breath when climbing stairs for 2 months. Her menstrual periods have been heavy since menarche, lasting 8 days with passage of clots. She follows a vegetarian diet. She has no history of serious illness.", "Examination shows conjunctival pallor and a grade 2/6 systolic ejection murmur at the left upper sternal border. Her nails are thin and spoon-shaped."], "labs": [["Hemoglobin", "8.4 g/dL"], ["Mean corpuscular volume", "70 μm³"], ["Reticulocytes", "0.6%"]], "q": "Which of the following sets of findings is most likely in this patient? (TIBC = total iron-binding capacity; RDW = red cell distribution width)", "o": ["TIBC ↓ · RDW normal · Ferritin ↑", "TIBC ↑ · RDW ↑ · Ferritin ↓", "TIBC normal · RDW normal · Ferritin normal", "TIBC ↓ · RDW ↑ · Ferritin ↑", "TIBC ↑ · RDW normal · Ferritin ↑"], "k": "C"},
{"stem": ["A 68-year-old right-handed man is brought to the emergency department because he suddenly became unable to read the newspaper this morning. He can still write a short paragraph when asked but cannot read what he has just written. Speech is fluent, and he follows commands and names objects correctly. He has hypertension and atrial fibrillation and stopped taking his anticoagulant 2 months ago.", "MRI of the brain shows an acute infarct involving the left occipital lobe and the splenium of the corpus callosum."], "q": "Visual field testing in this patient is most likely to show which of the following?", "o": ["Bitemporal hemianopia", "Right homonymous hemianopia with macular sparing", "Left homonymous hemianopia with macular sparing", "Right homonymous superior quadrantanopia", "Right monocular vision loss"], "k": "C"},
{"stem": ["A 27-year-old woman comes to the physician because of a 4-day history of burning with urination, urinary frequency, and a sensation of pelvic pressure. She has no vaginal discharge or flank pain. She is sexually active with one male partner and uses condoms inconsistently.", "Temperature is 37°C (98.6°F). There is no costovertebral angle tenderness, and pelvic examination shows no abnormalities. Urinalysis shows pyuria, but no bacteria are seen on Gram stain. A nucleic acid amplification test is ordered."], "q": "If left untreated, the most likely causal organism most commonly leads to which of the following complications?", "o": ["Perihepatitis and fallopian tube scarring", "Hydronephrosis with renal cortical scarring", "Perinephric abscess", "Septic arthritis", "Tenosynovitis and migratory polyarthritis"], "k": "B"},
{"stem": ["A 7-year-old girl is brought to the physician because of a rash on her legs and abdominal pain for 5 days. Two weeks ago, she had a sore throat and runny nose that resolved without treatment. The abdominal pain is crampy and comes in episodes, and her ankles and knees ache when she walks. This morning her urine was dark.", "Temperature is 37.3°C (99.1°F), and blood pressure is 108/66 mm Hg. Examination shows raised, nonblanching, reddish-purple papules and plaques on the buttocks, legs, and feet. Both ankles are swollen and tender. The abdomen is diffusely tender without guarding. A photograph of the lower extremity is shown."], "labs": [["Platelets", "310,000/mm³"], ["Prothrombin time", "12 sec"], ["Urinalysis", "3+ blood, 1+ protein, RBC casts"]], "img": {"src": "P", "alt": "Palpable purpuric papules and plaques on the foot and leg of a child", "credit": "Foto: Okwikikim / Wikimedia Commons, domínio público"}, "q": "A renal biopsy is most likely to show which of the following?", "o": ["Linear IgG deposition along the glomerular basement membrane", "Pauci-immune necrotizing crescents", "Splitting and lamination of the glomerular basement membrane", "Subepithelial immune complex humps", "Mesangial deposits of IgA"], "k": "F"},
{"stem": ["A 23-year-old woman comes to the physician because of a painless lump in her neck for 3 months. She has had intermittent loose stools during this period. She is 180 cm (5 ft 11 in) tall with long, thin limbs.", "Examination shows a firm 2-cm nodule in the left thyroid lobe that moves with swallowing, and multiple small, soft, pink nodules on the lips and anterior tongue. Thyroid function tests are within the reference range. Fine-needle aspiration of the thyroid nodule shows nests of spindle-shaped cells within an amorphous extracellular material that shows apple-green birefringence after Congo red staining."], "q": "A germline mutation in which of the following genes is most likely present in this patient?", "o": ["APC", "MEN1", "NF1", "RET", "VHL"], "k": "E"},
{"stem": ["A 31-year-old man is brought to the emergency department 15 minutes after being stung by a bee while gardening. He has diffuse itching, hoarseness, and shortness of breath. He had a large local reaction to a bee sting 1 year ago.", "Pulse is 128/min, respirations are 26/min, and blood pressure is 78/46 mm Hg. Examination shows generalized urticaria, swelling of the lips, and diffuse expiratory wheezes. Intramuscular epinephrine is administered."], "q": "Release of preformed histamine from this patient's mast cells was most directly triggered by which of the following intracellular events?", "o": ["Adenylyl cyclase activation with increased cyclic AMP", "Cyclooxygenase-mediated conversion of arachidonic acid", "Phospholipase C activation with inositol trisphosphate–mediated calcium release", "Janus kinase activation with STAT phosphorylation", "Nitric oxide–induced increase in cyclic GMP"], "k": "D"},
{"stem": ["A 2-year-old boy is brought to the physician because of developmental delay and self-injurious behavior. He cannot sit without support. His parents report that he repeatedly bites his lips and fingers, causing wounds, and that orange, sand-like crystals are often found in his diapers.", "Examination shows increased tone in all extremities with intermittent writhing movements of the arms. There are healing bite wounds on the lower lip and the tips of several fingers. Serum uric acid concentration is markedly increased."], "q": "This patient's condition is most likely caused by deficiency of an enzyme that catalyzes which of the following reactions?", "o": ["Adenosine → inosine", "Carbamoyl phosphate + aspartate → carbamoyl aspartate", "Orotic acid → uridine monophosphate", "Xanthine → uric acid", "Hypoxanthine + PRPP → inosine monophosphate"], "k": "F"},
{"stem": ["A 52-year-old woman comes to the emergency department 14 hours after her cat bit her right index finger. She washed the wound at home. Over the past few hours, the finger has become red, swollen, and increasingly painful. She has no history of serious illness and takes no medications. Her spleen is intact.", "Temperature is 37.4°C (99.3°F). Examination shows two puncture wounds over the proximal phalanx with surrounding erythema and edema extending to the dorsum of the hand, and a small amount of serosanguineous drainage. There is no regional lymphadenopathy."], "q": "Which of the following is the most likely causal organism?", "o": ["Bartonella henselae", "Capnocytophaga canimorsus", "Eikenella corrodens", "Pasteurella multocida", "Sporothrix schenckii"], "k": "E"},
{"stem": ["A 32-year-old woman is brought to the emergency department 40 minutes after a motor vehicle collision in which she was the restrained driver. She is anxious and reports left upper quadrant pain that radiates to her left shoulder.", "Pulse is 128/min, respirations are 24/min, and blood pressure is 82/58 mm Hg. Her skin is cool and pale, and capillary refill is delayed. There is a seat-belt bruise across the abdomen with tenderness in the left upper quadrant. Breath sounds are equal bilaterally, and the jugular veins are flat. Focused ultrasonography shows free fluid in the perisplenic space."], "q": "Which of the following sets of hemodynamic findings is most likely in this patient? (CO = cardiac output; PCWP = pulmonary capillary wedge pressure; SVR = systemic vascular resistance; CVP = central venous pressure)", "o": ["CO ↑ · PCWP ↓ · SVR ↓ · CVP ↓", "CO ↓ · PCWP ↓ · SVR ↑ · CVP ↓", "CO ↓ · PCWP ↑ · SVR ↑ · CVP ↑", "CO ↓ · PCWP ↓ · SVR ↓ · CVP ↓", "CO ↓ · PCWP ↓ · SVR ↑ · CVP ↑"], "k": "C"},

const LETTERS = ["A","B","C","D","E"];

let S = fresh();
function fresh(){ return {hl:{}, phase:"intro", mode:"exam", cur:0, ans:Array(N).fill(null), marked:Array(N).fill(false), struck:Q.map(()=>[]), revealed:Array(N).fill(false), elapsed:0, startedAt:null, finished:false}; }
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const v = JSON.parse(localStorage.getItem(STORE_KEY)||"null"); if(v && v.ans && v.ans.length===N) return v; }catch(e){} return null; }

const app = document.getElementById("app");

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmt(sec){ sec=Math.max(0,Math.round(sec)); const m=Math.floor(sec/60), s=sec%60; return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"); }
function score(){ let c=0; for(let i=0;i<N;i++) if(S.ans[i]===keyOf(i)) c++; return c; }

/* one orchestrated moment per screen: numbers count up, the score ring fills */
const RM = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function countUp(root){
  root.querySelectorAll("[data-to]").forEach(el => {
    const to = +el.dataset.to; if(RM || !to){ el.textContent = to; return; }
    const t0 = performance.now(), d = 900;
    const step = now => { const k = Math.min(1,(now-t0)/d), e = 1-Math.pow(1-k,3); el.textContent = Math.round(to*e); if(k<1) requestAnimationFrame(step); };
    el.textContent = 0; requestAnimationFrame(step);
  });
}
function fillRing(){
  const a = document.querySelector(".ring .arc"); if(!a) return;
  if(RM){ a.style.transition="none"; a.setAttribute("stroke-dashoffset", a.dataset.off); return; }
  requestAnimationFrame(() => requestAnimationFrame(() => a.setAttribute("stroke-dashoffset", a.dataset.off)));
}

function HK(i,k,html){ const s = S.hl && S.hl[i] && S.hl[i][k]; return (typeof s==="string") ? s : html; }
/* ---------- highlighter ---------- */
let hlBtn = null, hlT = null;
function hlSetup(){
  if(hlBtn) return;
  hlBtn = document.createElement("button"); hlBtn.type="button"; hlBtn.className="hlbtn"; hlBtn.textContent="Grifar"; hlBtn.style.display="none";
  document.body.appendChild(hlBtn);
  hlBtn.addEventListener("mousedown", e => e.preventDefault());
  hlBtn.addEventListener("click", () => { applyHL(); hlBtn.style.display="none"; });
  document.addEventListener("selectionchange", () => { clearTimeout(hlT); hlT = setTimeout(posHL, 120); });
  document.addEventListener("click", e => {
    const m = e.target.closest && e.target.closest("mark.hl");
    if(!m || S.phase!=="exam") return;
    const sel = getSelection(); if(sel && !sel.isCollapsed) return;
    const host = m.closest("[data-hk]"); m.replaceWith(...m.childNodes); host.normalize(); saveHL(host);
  });
}
function selRange(){
  const sel = getSelection(); if(!sel || !sel.rangeCount || sel.isCollapsed || S.phase!=="exam") return null;
  const r = sel.getRangeAt(0), sheet = document.querySelector(".sheet");
  if(!sheet || !sheet.contains(r.commonAncestorContainer)) return null;
  return r;
}
function posHL(){
  if(!hlBtn) return;
  const r = selRange(); if(!r){ hlBtn.style.display="none"; return; }
  const b = r.getBoundingClientRect();
  hlBtn.style.display="block";
  hlBtn.style.left = Math.max(8, Math.min(innerWidth-96, b.left + b.width/2 - 40)) + "px";
  hlBtn.style.top = (b.top > 60 ? b.top - 46 : b.bottom + 10) + "px";
}
function applyHL(){
  const r = selRange(); if(!r) return;
  let root = r.commonAncestorContainer; if(root.nodeType!==1) root = root.parentNode;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [];
  while(w.nextNode()){ const n = w.currentNode; if(r.intersectsNode(n) && n.parentNode.closest("[data-hk]") && !n.parentNode.closest("mark.hl") && n.textContent.trim()) nodes.push(n); }
  const hosts = new Set();
  nodes.forEach(n => {
    let s = 0, e = n.length;
    if(n===r.startContainer) s = r.startOffset;
    if(n===r.endContainer) e = r.endOffset;
    if(e <= s) return;
    let t = n; if(s > 0) t = t.splitText(s); if(e - s < t.length) t.splitText(e - s);
    const m = document.createElement("mark"); m.className = "hl"; t.parentNode.insertBefore(m, t); m.appendChild(t);
    hosts.add(m.closest("[data-hk]"));
  });
  getSelection().removeAllRanges(); hosts.forEach(saveHL);
}
function saveHL(host){
  if(!host) return; S.hl = S.hl || {}; (S.hl[S.cur] = S.hl[S.cur] || {})[host.dataset.hk] = host.innerHTML; save();
}
function questionHTML(i, review){
  const q = Q[i], k = keyOf(i), a = S.ans[i];
  const show = review || (S.mode==="tutor" && S.revealed[i]);
  let h = `<div class="stem">` + q.stem.map((p,n)=>`<p data-hk="s${n}">${HK(i,"s"+n,p)}</p>`).join("");
  if(q.labs) h += `<div class="tbl-wrap"><table class="labs"><caption>Laboratory studies</caption>${q.labs.map((r,n)=>`<tr data-hk="l${n}">${HK(i,"l"+n,`<td>${r[0]}</td><td>${r[1]}</td>`)}</tr>`).join("")}</table></div>`;
  if(q.after) h += q.after.map((p,n)=>`<p data-hk="a${n}">${HK(i,"a"+n,p)}</p>`).join("");
  if(q.img) h += `<figure class="figure"><img src="${IMGS[q.img.src]}" alt="${esc(q.img.alt)}" class="${q.img.src==="E"?"wide":""}">${q.img.credit?`<figcaption>${esc(q.img.credit)}</figcaption>`:""}</figure>`;
  h += `</div><p class="qtitle" data-hk="q">${HK(i,"q",esc(q.q))}</p><ul class="opts" role="radiogroup" aria-label="Alternativas">`;
  q.o.forEach((t,j)=>{
    const struck = S.struck[i].includes(j);
    let cls = "opt" + (struck?" struck":"");
    if(show && j===k) cls += " correct";
    if(show && a===j && j!==k) cls += " wrong";
    h += `<li class="${cls}"><label for="q${i}o${j}"><input type="radio" name="q${i}" id="q${i}o${j}" value="${j}" ${a===j?"checked":""} ${show?"disabled":""}><span class="L">${LETTERS[j]}.</span><span class="txt">${esc(t)}</span></label>${show?"<span></span>":`<button class="strike" data-strike="${j}" aria-label="Riscar alternativa ${LETTERS[j]}" title="Riscar">ab</button>`}</li>`;
  });
  h += `</ul>`;
  if(S.mode==="tutor" && !review && !S.revealed[i]) h += `<div class="actions"><button class="btn" id="submitq" ${a===null?"disabled":""}>Confirmar resposta</button></div>`;
  if(show){
    const ok = a===k;
    h += a===null ? `<div class="verdict no"><b>Não respondida</b> · Resposta correta: ${LETTERS[k]}</div>`
                  : `<div class="verdict ${ok?"":"no"}"><b>${ok?"Correta":"Incorreta"}</b>${ok?"":` · Resposta correta: ${LETTERS[k]}`}</div>`;
  }
  return h;
}

let labTab = "Serum", labQ = "";
function labRows(){
  const q = labQ.trim().toLowerCase();
  const tabs = q ? Object.keys(LABS) : [labTab];
  let html = "";
  tabs.forEach(t => {
    let rows = LABS[t];
    if(q){
      // keep a row if it matches; keep continuation rows under a matching parent; keep group headers with matches below
      const out = []; let parent = null, parentHit = false, sub = null;
      rows.forEach(r => {
        const [k,n,v] = r;
        if(k==="H"){ return; }
        if(k==="S"){ sub = r; parentHit = n.toLowerCase().includes(q); if(parentHit) out.push(r); return; }
        if(k==="c"){ if(parentHit) out.push(r); return; }
        const hit = (n+" "+(v||"")).toLowerCase().includes(q) || (sub && k==="i" && sub[1].toLowerCase().includes(q));
        parentHit = hit;
        if(hit){ if(sub && k==="i" && !out.includes(sub)) out.push(sub); out.push(r); }
      });
      if(!out.length) return;
      html += `<tr class="lh"><td colspan="2">${esc(t.toUpperCase())}</td></tr>`;
      rows = out;
    }
    rows.forEach(([k,n,v]) => {
      if(k==="H") html += `<tr class="lh"><td>${esc(n)}</td><td>Reference Range</td></tr>`;
      else if(k==="S") html += `<tr class="ls"><td colspan="2">${esc(n)}</td></tr>`;
      else html += `<tr class="l${k}"><td>${esc(n)}</td><td>${esc(v).replace(/^ {3}/,"&emsp;")}</td></tr>`;
    });
  });
  return html || `<tr><td colspan="2" class="lempty">Nenhum resultado para “${esc(labQ)}”.</td></tr>`;
}

  const b = document.getElementById("labbody"); if(b) b.innerHTML = labRows();

}

  document.body.appendChild(v);

}

    [{label:"Encerrar e ver nota", fn:finish},{label:"Continuar", ghost:true}]);
}
function pauseDialog(){
  stopClock();
  dialog("Bloco pausado", "O cronômetro parou. Suas respostas ficam guardadas neste navegador.", [{label:"Voltar ao bloco", fn:startClock}]);
}
function startClock(){
  stopClock();
  let last = Date.now();
  tick = setInterval(() => {
    const now = Date.now(); S.elapsed += (now-last)/1000; last = now;
    const left = LIMIT - S.elapsed;
    const c = document.getElementById("clock");
    if(c){ c.textContent = "Tempo restante " + fmt(left); c.classList.toggle("low", left <= 120); }
    if(Math.floor(S.elapsed) % 5 === 0) save();
    if(left <= 0){ stopClock(); finish(true); }
  }, 1000);
}
function stopClock(){ if(tick){ clearInterval(tick); tick = null; } }

function finish(timeout){
  stopClock(); if(isFS()) exitFS();
  S.finished = true; S.phase = "results"; S.elapsed = Math.min(S.elapsed, LIMIT);
  save(); renderResults(timeout);
}

  return SEND_URL + "?" + p.toString();
}

/* ---------- access code ---------- */
const CODE_HASH = "9f90ea67a301a0e1ab9cd0e9cd91d859207829da59e6a147611ba50e753821fc";
const UNLOCK_KEY = STORE_KEY + "-acesso";
async function sha(s){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
function unlocked(){ try{ return localStorage.getItem(UNLOCK_KEY)===CODE_HASH; }catch(e){ return false; } }
function renderGate(){
  app.innerHTML = `
  <main class="intro${window.__introDone?"":" reveal"}">
    <header class="banner">
      <img src="${LOGO}" alt="Brasão da Med in the USA">
      <div><div class="eyebrow">Med in the USA</div><h1>Grand <mark>Rounds</mark></h1><p>Acesso exclusivo para mentorados.</p></div>
    </header>
    <section class="card">
      <h2>Código de acesso</h2>
      <form id="gate" class="gate" autocomplete="off">
        <label for="code" class="gl">Digite o código que você recebeu do Paulo.</label>
        <div class="row"><input id="code" class="codein" type="text" inputmode="text" autocapitalize="characters" spellcheck="false" aria-describedby="gmsg"><button class="btn" type="submit">Entrar</button></div>
        <p id="gmsg" class="gmsg" role="alert"></p>
      </form>
    </section>
  </main>`;
  const f = document.getElementById("gate"), inp = document.getElementById("code"), msg = document.getElementById("gmsg");
  inp.focus();
  f.onsubmit = async e => {
    e.preventDefault();
    const h = await sha(inp.value.trim().toUpperCase().replace(/\s+/g,""));
    if(h===CODE_HASH){ try{ localStorage.setItem(UNLOCK_KEY, CODE_HASH); }catch(err){} renderIntro(); }
    else { msg.textContent = "Esse código não está certo. Confira com o Paulo e tente de novo."; inp.select(); }
  };
}

if(unlocked()) renderIntro(); else renderGate();
